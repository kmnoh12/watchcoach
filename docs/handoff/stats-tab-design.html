<style>
/* Layout: the real app's stats tab inside a phone frame. Same tokens as the app (KColors), title row of TabPage (32px medium, 20px side padding),
   section header = 13px muted label over a hairline, and the floating tab bar at the bottom with 통계 selected. */
:root { --bg:#000; --surface:#0E0E0D; --raised:#1C1B19; --selected:#262522; --text:#EDE8DC; --muted:#8F8B82; --soft:#A39F98; --faint:#5C5952; --hairline:#1E1D1A; --ghost:#3A3833; --accent:#63D6DE; --wash:#0B2A2D; --font:Roboto,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif; color-scheme:dark; }
body { background:#141413; color:var(--text); font-family:var(--font); padding-block:16px; padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px)); }
.phone { position:relative; width:min(100%,392px); margin:0 auto; background:var(--bg); border:1px solid var(--hairline); border-radius:30px; }
.screen { padding:20px 20px 28px; }
.titlerow { display:flex; align-items:center; justify-content:space-between; min-height:52px; }
.titlerow h1 { font-size:32px; font-weight:500; margin:0; }
.seg { display:inline-flex; gap:4px; }
.month { color:var(--muted); font-size:14px; }
.seg button { font:inherit; font-size:13px; color:var(--muted); background:var(--surface); border:1px solid transparent; border-radius:6px; padding:7px 11px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--wash); border-color:var(--accent); color:var(--accent); font-weight:500; }
section { margin-top:28px; }
.sech { display:flex; align-items:baseline; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; padding-bottom:6px; border-bottom:.5px solid var(--hairline); }
.sech h2 { font-size:13px; font-weight:400; margin:0; color:var(--muted); }
.sum { color:var(--soft); font-size:15px; line-height:1.5; margin:12px 0 10px; }
.sum b { color:var(--text); font-weight:500; } .sum em { color:var(--accent); font-style:normal; font-weight:500; } .sum b, .sum em { white-space:nowrap; }
#stage { position:relative; width:100%; aspect-ratio:1.43; background:#000; border-radius:10px; overflow:hidden; touch-action:pan-y; cursor:grab; margin-top:6px; }
#stage canvas { position:absolute; left:0; top:0; display:block; }
.when { text-align:center; margin-top:12px; }
.when .parts { font-size:16px; font-weight:500; }
.when .date { color:var(--muted); font-size:13px; margin-top:3px; }
.slider { display:flex; align-items:center; gap:12px; margin-top:10px; }
.slider { align-items:flex-start; }
.track { flex:1; min-width:0; }
.slider input { width:100%; display:block; accent-color:var(--accent); height:28px; margin:0; }
.range { display:flex; justify-content:space-between; color:var(--faint); font-size:11px; margin-top:2px; }
.slider button { font:inherit; font-size:13px; color:var(--accent); background:var(--surface); border:0; border-radius:6px; padding:7px 12px; cursor:pointer; }
.chart { width:100%; display:block; }
.chart text { fill:var(--muted); font-family:var(--font); font-size:10.5px; }
.chart .val { fill:var(--text); font-weight:500; }
.legend { display:flex; gap:16px; color:var(--muted); font-size:12px; margin-top:6px; }
.legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
.rec { list-style:none; margin:0; padding:0; }
.rec li { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:.5px solid var(--hairline); }
.rec .n { font-size:15px; color:var(--soft); } .rec .d { color:var(--muted); font-size:12px; margin-top:2px; }
.rec .v { color:var(--text); font-weight:500; font-size:15px; white-space:nowrap; text-align:right; } .rec .v small { display:block; color:var(--accent); font-weight:400; font-size:12px; }
.metrics { display:grid; grid-template-columns:1fr 1fr; }
.metrics div { padding:16px 0; border-bottom:.5px solid var(--hairline); }
.metrics b { display:block; font-size:30px; font-weight:500; letter-spacing:-.5px; }
.metrics span { color:var(--muted); font-size:12px; }
.rows div { display:flex; justify-content:space-between; padding:14px 0; font-size:15px; border-bottom:.5px solid var(--hairline); }
.rows span { color:var(--soft); } .rows b { font-weight:500; }
.tabbar { position:sticky; margin:0 14px 12px; bottom:12px; display:flex; gap:0; background:#2A2927; border:none; border-radius:10px; padding:4px; box-shadow:inset 2px 2px 1px rgba(0,0,0,.9), inset -1px -1px 1px rgba(255,255,255,.14), 1.5px 1.5px 1px rgba(255,255,255,.2), -1px -1px 1px rgba(0,0,0,.9); }
.tabbar div { flex:1; height:48px; display:flex; align-items:center; justify-content:center; gap:6px; color:#F4F1EA; border-radius:6px; font-size:14px; font-weight:500; }
.tabbar div.on { flex:0 0 86.2px; height:43.1px; align-self:center; font-size:14px; background:linear-gradient(145deg,#7CE0E7,#4FC8D1); box-shadow:inset 1px 1px 1.5px rgba(255,255,255,.35), inset -2px -2px 4px rgba(0,60,70,.4), 2px 3px 6px rgba(0,0,0,.7); color:#04140E; font-weight:600; }
.tabbar div.on svg { width:22px; height:22px; }
.tabbar svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

</style>
<div class="phone">
<div class="screen" id="screen">
  <div class="titlerow">
    <h1>통계</h1>
    <span class="month">11월</span>
  </div>

  <section>
    <div class="sech"><h2>근육 피로도</h2></div>
    <div id="stage" aria-label="근육 피로도를 칠한 3D 몸 앞모습과 뒷모습"></div>
    <div class="when"><div class="parts" id="whenParts"></div><div class="date" id="whenDate"></div></div>
    <div class="slider"><div class="track"><input id="day" type="range" min="-32" max="32" step="1" value="0" aria-label="시각, 지금 기준 앞뒤 4일을 3시간 간격으로"><div class="range"><span>4일 전</span><span>지금</span><span>4일 뒤</span></div></div><button id="today">지금</button></div>
  </section>

  <section>
    <div class="sech"><h2>이번 주 볼륨</h2></div>
    <p class="sum" id="weekSum"></p>
    <svg class="chart" id="weekChart" viewBox="0 0 360 190" role="img" aria-label="요일별 누적 볼륨, 이번 주와 지난주"></svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>이번 주</span><span><i style="background:var(--ghost)"></i>지난주</span></div>
  </section>

  <section>
    <div class="sech"><h2>부위별 볼륨</h2><div class="seg" id="period" role="group" aria-label="집계 기간"><button data-d="7" aria-pressed="true">7일</button><button data-d="30" aria-pressed="false">30일</button><button data-d="90" aria-pressed="false">90일</button><button data-d="0" aria-pressed="false">전체</button></div></div>
    <svg class="chart" id="radar" viewBox="0 0 360 300" role="img" aria-label="부위별 볼륨 레이더, 이번 기간과 직전 기간"></svg>
    <div class="legend"><span id="curKey"><i style="background:var(--accent)"></i>이번 기간</span><span id="prevKey"><i style="background:#55524b"></i>직전 기간</span></div>
  </section>

  <section>
    <div class="sech"><h2>새 기록</h2></div>
    <ul class="rec" id="records"></ul>
  </section>

  <section>
    <div class="sech"><h2>누적 기록</h2><div class="seg" id="cumPeriod" role="group" aria-label="누적 기록 기간"><button data-c="7" aria-pressed="false">7일</button><button data-c="30" aria-pressed="false">30일</button><button data-c="90" aria-pressed="false">90일</button><button data-c="0" aria-pressed="true">전체</button></div></div>
    <div class="metrics">
      <div><b id="cumWorkouts"></b><span>운동</span></div><div><b id="cumMinutes"></b><span>총 시간</span></div>
      <div><b id="cumSets"></b><span>총 세트</span></div><div><b id="cumVolume"></b><span>총 볼륨</span></div>
    </div>
  </section>

  <section>
    <div class="sech"><h2>루틴별 세트</h2><span id="cumLabel">전체</span></div>
    <div class="rows" id="cumRoutines"></div>
  </section>
</div>
<div class="tabbar" aria-hidden="true">
  <div><svg viewBox="0 0 24 24"><path d="M4 11 12 4 20 11M6.5 9.5V20H17.5V9.5"/></svg></div>
  <div><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10H20M8 3.5V7M16 3.5V7"/></svg></div>
  <div class="on"><svg viewBox="0 0 24 24"><path d="M6 20V13M12 20V6M18 20V10"/></svg>통계</div>
  <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></div>
  <div><svg viewBox="0 0 24 24"><path d="M5 7H19M5 12H19M5 17H19"/></svg></div>
</div>
</div>

<script>
/* Sample data: ~7 months of a four-day split, today = Thursday 12 Nov 2026. Everything below is computed from it, like the app computes from the logs. */
(function () {
  const TODAY = new Date(2026, 10, 12);
  const NOW = new Date(2026, 10, 12, 19, 0); // "now" of the sample: Thursday 19:00
  const HOUR = 3600000;
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const TEMPL = {
    push: { name: "가슴·삼두", min: 62, sets: { 가슴: 10, 전면어깨: 5, 측면어깨: 1, 삼두: 6 }, vol: { 가슴: 5200, 어깨: 1700, 팔: 1300 } },
    pull: { name: "등·이두", min: 58, sets: { 등: 12, 후면어깨: 4, 승모: 3, 이두: 8 }, vol: { 등: 6400, 어깨: 600, 팔: 1700 } },
    legs: { name: "하체", min: 66, sets: { 하체: 14, 코어: 5 }, vol: { 하체: 8200, 코어: 1600 } },
    arms: { name: "어깨전문", min: 55, sets: { 측면어깨: 8, 후면어깨: 4, 전면어깨: 2, 이두: 6, 삼두: 6, 승모: 3 }, vol: { 어깨: 3200, 팔: 2800 } },
  };
  const PLAN = { 1: "pull", 2: "push", 4: "legs", 5: "arms" };
  const GROUPS = ["가슴", "어깨", "팔", "등", "코어", "하체"];
  const SETGROUP = { 가슴: "가슴", 등: "등", 승모: "등", 전면어깨: "어깨", 측면어깨: "어깨", 후면어깨: "어깨", 이두: "팔", 삼두: "팔", 코어: "코어", 하체: "하체" };
  const REC = { 가슴: 3, 등: 3, 하체: 3.5, 이두: 2, 삼두: 2, 전면어깨: 2, 측면어깨: 2, 후면어깨: 2, 코어: 2, 승모: 2 };
  const FULL = 15;
  const frac = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };

  const LOGS = [];
  for (let ago = 0; ago < 230; ago++) {
    const date = new Date(TODAY); date.setDate(date.getDate() - ago);
    const type = PLAN[date.getDay()];
    if (!type || (ago > 3 && Math.floor(frac(ago + 3) * 10) === 0)) continue;
    const f = 0.88 + 0.24 * frac(ago) + (1 - ago * 0.0012) - 1;
    const t = TEMPL[type], sets = {}, vol = {};
    for (const k in t.sets) sets[k] = Math.max(1, Math.round(t.sets[k] * (1 + f - 0.88 + 0.0)));
    for (const k in t.vol) vol[k] = Math.round(t.vol[k] * (1 + f - 0.88));
    const at = new Date(date); at.setHours(17, 30, 0, 0);
    LOGS.push({ ago, date, at: at.getTime(), name: t.name, minutes: Math.round(t.min * (0.9 + 0.2 * frac(ago + 7))), sets, vol, total: Object.values(vol).reduce((a, b) => a + b, 0) });
  }
  const fmt = n => Math.round(n).toLocaleString("ko-KR");
  const k1 = n => (n / 1000).toFixed(1) + "k";
  const $ = id => document.getElementById(id);
  const dayVol = ago => LOGS.filter(l => l.ago === ago).reduce((s, l) => s + l.total, 0);
  const rangeLogs = (from, to) => LOGS.filter(l => l.ago >= from && l.ago <= to);
  const ALL = 100000; // "전체" = every log, with no earlier period to compare with // ago from..to inclusive

  /* ---------- fatigue model (same shape as the app: each set adds one unit that fades along an S curve over the part's recovery time) ---------- */
  const stillTired = x => 1 - (3 * x * x - 2 * x * x * x);
  function fatigueAt(hours) { // hours from now, negative = past
    const units = {}, when = NOW.getTime() + hours * HOUR;
    for (const s of LOGS) {
      const age = (when - s.at) / (24 * HOUR); if (age < 0) continue;
      for (const part in s.sets) { const x = age / REC[part]; if (x < 1) units[part] = (units[part] || 0) + s.sets[part] * stillTired(x); }
    }
    const out = {}; for (const p in units) out[p] = Math.min(1, units[p] / FULL); return out;
  }
  const label = p => p.replace("어깨", " 어깨");
  function setDay(t) { // t in hours from now
    window.FATIGUE = fatigueAt(t);
    if (window.paintFatigue) window.paintFatigue();
    const top = Object.entries(window.FATIGUE).filter(e => e[1] >= 0.08).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => label(e[0]));
    $("whenParts").textContent = top.length ? (t > 0 ? "회복 중 · " : "") + top.join(" · ") : "모두 회복";
    const d = new Date(NOW.getTime() + t * HOUR), a = Math.abs(t);
    const span = (a >= 24 ? Math.floor(a / 24) + "일 " : "") + (a % 24 ? (a % 24) + "시간 " : "");
    $("whenDate").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) ${d.getHours()}시 · ` + (t === 0 ? "지금" : span + (t > 0 ? "뒤" : "전"));
  }
  let lastStep = 0;
  // One slider step = 3 hours. Every step that changes gives a short tick of haptic feedback where the device allows it.
  $("day").addEventListener("input", e => {
    const step = +e.target.value;
    if (step !== lastStep) { lastStep = step; try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} }
    setDay(step * 3);
  });
  $("today").addEventListener("click", () => { $("day").value = 0; lastStep = 0; try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} setDay(0); });
  setDay(0);

  /* ---------- svg helpers ---------- */
  const smooth = pts => {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
    }
    return d;
  };
  const niceMax = v => { const step = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * step >= v) return m * step; return v; };

  /* ---------- tween: values glide from what is on screen to the new target (zeros the first time or when the count changes) ---------- */
  const TW = {};
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tween(key, target, render, ms = 520) {
    const st = TW[key] || (TW[key] = { v: null, raf: 0 });
    cancelAnimationFrame(st.raf);
    const from = st.v && st.v.length === target.length ? st.v.slice() : target.map(() => 0);
    if (calm) { st.v = target.slice(); render(st.v); return; }
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      st.v = target.map((x, i) => from[i] + (x - from[i]) * e);
      render(st.v);
      if (p < 1) st.raf = requestAnimationFrame(step);
    };
    st.raf = requestAnimationFrame(step);
  }

  /* ---------- this week vs last week (running total by weekday) ---------- */
  function drawWeek() {
    const dow = (TODAY.getDay() + 6) % 7; // 0 = Monday
    const cum = (startAgo, count) => { let s = 0; return Array.from({ length: count }, (_, i) => (s += dayVol(startAgo - i))); };
    const thisW = cum(dow, dow + 1), lastW = cum(dow + 7, 7);
    const max = niceMax(Math.max(lastW[6], thisW[dow]) * 1.05);
    const L = 36, R = 14, T = 12, B = 26, W = 360, H = 190, w = W - L - R, h = H - T - B;
    const X = i => L + (w * i) / 6, Y = v => T + h - (h * v) / max;
    let s = "";
    for (let g = 0; g <= 3; g++) { const v = (max * g) / 3; s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--selected)" stroke-width=".6"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v ? k1(v) : "0"}</text>`; }
    ["월", "화", "수", "목", "금", "토", "일"].forEach((n, i) => s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" ${i === dow ? 'style="fill:var(--text)"' : ""}>${n}</text>`);
    const lp = lastW.map((v, i) => [X(i), Y(v)]), tp = thisW.map((v, i) => [X(i), Y(v)]);
    s += `<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63D6DE" stop-opacity=".34"/><stop offset="1" stop-color="#63D6DE" stop-opacity="0"/></linearGradient></defs>`;
    s += `<path d="${smooth(lp)}" fill="none" stroke="var(--ghost)" stroke-width="2" stroke-linecap="round"/>`;
    const area = smooth(tp) + ` L${tp[tp.length - 1][0]},${Y(0)} L${tp[0][0]},${Y(0)} Z`;
    s += `<path d="${area}" fill="url(#gA)"/><path d="${smooth(tp)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>`;
    const e = tp[tp.length - 1]; s += `<circle cx="${e[0]}" cy="${e[1]}" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.4"/>`;
    $("weekChart").innerHTML = s;
    const diff = thisW[dow] - lastW[dow];
    $("weekSum").innerHTML = `이번 주 <b>${fmt(thisW[dow])}kg</b>, 지난주 ${DOW[(dow + 1) % 7]}요일까지보다 <em>${fmt(Math.abs(diff))}kg ${diff >= 0 ? "더" : "덜"}</em> 들었어요`;
  }

  /* ---------- per body part (period driven) ---------- */
  let P = 7;
  const groupVol = logs => { const o = Object.fromEntries(GROUPS.map(g => [g, 0])); logs.forEach(l => { for (const g in l.vol) o[g] += l.vol[g]; }); return o; };
  // The radar is the part-volume chart: kg lifted per body part over the chosen period, with the previous period of the same length as the grey outline.
  function drawParts() {
    const cur = groupVol(rangeLogs(0, P ? P - 1 : ALL)), prev = groupVol(P ? rangeLogs(P, 2 * P - 1) : []);
    const cx = 180, cy = 152, R = 100, n = GROUPS.length;
    const ang = i => -Math.PI / 2 + (2 * Math.PI * i) / n;
    const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v, cy + Math.sin(ang(i)) * R * v];
    const top = niceMax(Math.max(...GROUPS.map(g => Math.max(cur[g], prev[g]))) * 1.05);
    let frame = "";
    [1 / 3, 2 / 3, 1].forEach(r => frame += `<polygon points="${GROUPS.map((_, i) => pt(i, r).join(",")).join(" ")}" fill="none" stroke="var(--selected)" stroke-width=".8"/>`);
    GROUPS.forEach((g, i) => {
      const [x, y] = pt(i, 1), [lx, ly] = pt(i, 1.24);
      frame += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--selected)" stroke-width=".6"/>`
        + `<text x="${lx}" y="${ly}" text-anchor="middle" style="fill:var(--text);font-size:12.5px;font-weight:500">${g}</text>`
        + `<text x="${lx}" y="${ly + 14}" text-anchor="middle" style="font-size:11px">${k1(cur[g])}</text>`;
    });
    tween("radar", [...GROUPS.map(g => cur[g] / top), ...GROUPS.map(g => prev[g] / top)], v => {
      const c = GROUPS.map((_, i) => pt(i, v[i])), p = GROUPS.map((_, i) => pt(i, v[n + i]));
      $("radar").innerHTML = frame
        + (P ? `<polygon points="${p.map(q => q.join(",")).join(" ")}" fill="#55524b" fill-opacity=".18" stroke="#6b6860" stroke-width="1.4"/>` : "")
        + `<polygon points="${c.map(q => q.join(",")).join(" ")}" fill="#63D6DE" fill-opacity=".24" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`
        + c.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.2" fill="var(--accent)"/>`).join("");
    });
  }

  /* ---------- records ---------- */
  $("records").innerHTML = [
    ["벤치프레스", "82.5kg × 5", "+2.5kg", "3일 전"],
    ["바벨 로우", "70kg × 8", "+5kg", "4일 전"],
    ["스쿼트", "100kg × 6", "+1회", "8일 전"],
  ].map(r => `<li><div><div class="n">${r[0]}</div><div class="d">${r[3]}</div></div><div class="v">${r[1]}<small>${r[2]}</small></div></li>`).join("");

  /* ---------- cumulative record: its own 7 / 30 / 90 / all switch, separate from the radar's ---------- */
  let C = 0;
  function drawCum() {
    const logs = rangeLogs(0, C ? C - 1 : ALL), sets = l => Object.values(l.sets).reduce((a, b) => a + b, 0);
    $("cumWorkouts").textContent = fmt(logs.length) + "회";
    $("cumMinutes").textContent = fmt(logs.reduce((s, l) => s + l.minutes, 0)) + "분";
    $("cumSets").textContent = fmt(logs.reduce((s, l) => s + sets(l), 0)) + "세트";
    $("cumVolume").textContent = fmt(logs.reduce((s, l) => s + l.total, 0)) + "kg";
    const byName = {}; logs.forEach(l => { byName[l.name] = (byName[l.name] || 0) + sets(l); });
    $("cumRoutines").innerHTML = Object.entries(byName).sort((a, b) => b[1] - a[1]).map(e => `<div><span>${e[0]}</span><b>${fmt(e[1])}세트</b></div>`).join("");
    $("cumLabel").textContent = C ? `최근 ${C}일` : "전체";
  }

  /* ---------- controls ---------- */
  const seg = (id, attr, fn) => $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    fn(b.dataset[attr]);
  });
  seg("period", "d", v => { P = +v; $("prevKey").hidden = !P; $("curKey").lastChild.textContent = P ? "이번 기간" : "전체 기간"; drawParts(); });
  seg("cumPeriod", "c", v => { C = +v; drawCum(); });
  drawWeek(); drawParts(); drawCum();
})();

</script>

// The V5 low-poly man in his rest A-pose (arms away from the body, feet apart), straight from base.json.
// Left figure shows the front and right the back, each turned 30 degrees. Static: drawn once, repainted on resize.
const YAW = Math.PI / 6;
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2, -3, 5); scene.add(sun);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
camera.up.set(0, 0, 1);
camera.position.set(0, -6, 0.9);
camera.lookAt(0, 0, 0.9);
const figures = new THREE.Group(); scene.add(figures);

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  const aspect = r.width / r.height;
  // Height 1.8 m plus margin; each figure needs about 1 m of the width (arms out).
  const halfH = Math.max(0.98, 1.38 / aspect);   // the camera already sits at body-centre height
  camera.left = -halfH * aspect; camera.right = halfH * aspect; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  figures.children.forEach((m, i) => m.position.x = (i ? 1 : -1) * halfH * aspect / 2);
  renderer.render(scene, camera);
}

async function load() {
  const base = BASE;
  const points = new Float32Array(base.rest);
  // Fatigue per part arrives in the query (?가슴=0.7&등=0.2, 1 = fully worn out, 0 = recovered; it builds up over days and fades with time): light body, tired parts painted in the app's aqua, deepening at full fatigue.
  const query = { get: n => (window.FATIGUE || {})[n] };
  const grey = new THREE.Color(0xe4e6e8), aqua = new THREE.Color(0x63d6de), deep = new THREE.Color(0x0a9fb4);
  // Each muscle is a set of whole faces of this exact mesh, picked by eye along its creases, like filling shapes with a paint bucket.
  // Lists name the body's left side (+x); the mesh is mirror-symmetric, so the right side is found by mirroring. No face is in two lists.
  // Hands, feet, head, neck, the armpit hollows and the groin stay grey.
  const MUSCLE_FACES = {
    // Pectoralis major: clavicular band under the collarbone, the sternal plate, the strip tapering into the armpit,
    // the shelf underneath whose outer end rises into the front armpit fold, and the sternum groove so both pecs read as one chest.
    "가슴": [78, 93, 110, 118, 88, 77, 149, 171, 177, 138, 151, 166, 169, 63, 80, 7, 11, 12, 16, 20],
    // Deltoid cap in three heads, ending at the row where the upper arm starts: front (top-front and front of the cap),
    // side (outer cap), rear (back of the cap).
    "전면어깨": [174, 157, 196, 218, 202, 222, 206],
    "측면어깨": [245, 253, 283, 287, 274],
    "후면어깨": [251, 250, 261, 216, 220, 224, 231, 176, 195],
    // 승모 is the upper trapezius, the part a shrug works: neck slopes and shoulder tops (also seen from the front) and,
    // on the back, everything above the line in MUSCLE_CUTS. The middle and lower trapezius belong to 등, because rows and
    // pulldowns work them together with the lats.
    "승모": [67, 79, 97, 184, 71, 13, 128, 150, 115, 200],
    // Back: middle and lower trapezius down the spine to the V point, the shoulder-blade muscles beside them, the lat wings
    // from the back armpit down to the waist, and the lower back.
    "등": [18, 2, 17, 51, 72, 96, 182, 187, 147, 139, 105, 98, 109, 56, 23, 100, 82, 39, 346],
    // Abs from the pec shelf down to the lower belly, plus the obliques on the flank.
    "코어": [74, 31, 104, 59, 111, 40, 76, 95, 36, 65, 19, 94, 6, 106, 116, 127, 129, 134],
    // Upper arm below the deltoid: front and outer-front faces are biceps, back and outer-back faces triceps; the inner faces
    // are split by whether they sit in front of or behind the arm's middle.
    "이두": [293, 228, 264, 297, 269, 309, 310, 304, 289, 314, 199, 209, 257, 298],
    "삼두": [279, 211, 263, 259, 295, 302, 320, 292, 308, 322, 219, 241, 296, 194],
    // Whole limb segments are listed by their bone below; these are the extra faces they also own:
    // the elbow-top face for the forearm, the buttock tops for the legs.
    "전완": [323],
    "하체": [55, 54, 47, 34, 33],
  };
  // Where a muscle edge runs through the middle of a big face, the face is cut along a straight line and each piece is painted
  // separately (the pieces lie in the same plane, so the body's shape does not change). The line is given in back view as
  // [x, z] points on the left side and is mirrored for the right.
  const MUSCLE_CUTS = [
    // Lower edge of the upper trapezius: from the spine at about the third back vertebra up to the top inner corner of the
    // shoulder blade, where it meets the existing edge that runs on to the shoulder tip.
    { faces: [119, 41, 26], line: [[0, 1.38], [0.149, 1.414]], above: "승모", below: "등" },
  ];
  // Every face moved mainly by these bones belongs to that whole-limb group (the hand, foot and toes are excluded by not being listed).
  const LIMB_BONES = { "전완": /^lowerarm_/, "하체": /^(thigh|calf)_/ };
  const tri = base.triangles, faces = tri.length / 3;
  const corner = (f, k) => tri[f * 3 + k];
  const mainBone = f => {
    const sum = {};
    for (let k = 0; k < 3; k++) { const v = corner(f, k); base.joints[v].forEach((j, n) => sum[j] = (sum[j] || 0) + base.weights[v][n]); }
    return base.bone_names[+Object.keys(sum).reduce((a, b) => sum[a] >= sum[b] ? a : b)];
  };
  const at = (x, y, z) => [x, y, z].map(c => Math.round(c * 1e4)).join();
  const vertexAt = new Map(); for (let v = 0; v < points.length / 3; v++) vertexAt.set(at(points[v * 3], points[v * 3 + 1], points[v * 3 + 2]), v);
  const mirrorVertex = v => vertexAt.get(at(-points[v * 3] || 0, points[v * 3 + 1], points[v * 3 + 2]));
  const faceOf = new Map(); for (let f = 0; f < faces; f++) faceOf.set([0, 1, 2].map(k => corner(f, k)).sort((a, b) => a - b).join(), f);
  const mirrorFace = f => faceOf.get([0, 1, 2].map(k => mirrorVertex(corner(f, k))).sort((a, b) => a - b).join());
  const facePart = new Map();
  // The skin weights are not quite symmetric at the hip and ankle, so the left side decides and is mirrored; only faces with
  // no mirror twin (a few wrist triangles are split the other way) decide for themselves.
  const leftSide = f => [0, 1, 2].reduce((s, k) => s + points[corner(f, k) * 3], 0) > 0;
  const limbOf = f => { const bone = mainBone(f); return Object.keys(LIMB_BONES).find(name => LIMB_BONES[name].test(bone)); };
  for (let f = 0; f < faces; f++) {
    const twin = mirrorFace(f);
    if (!leftSide(f) && twin !== undefined) continue;
    const name = limbOf(f); if (!name) continue;
    facePart.set(f, name); if (twin !== undefined) facePart.set(twin, name);
  }
  for (const [name, list] of Object.entries(MUSCLE_FACES)) for (const f of list) { facePart.set(f, name); facePart.set(mirrorFace(f), name); }
  const cutOf = new Map();
  for (const cut of MUSCLE_CUTS) for (const f of cut.faces) { cutOf.set(f, cut); cutOf.set(mirrorFace(f), cut); }
  const colorOf = name => {
    const fatigue = Number(query.get(name) || 0);
    if (!(fatigue > 0)) return grey.clone();
    // Light body, fatigue brightens into the brand aqua by 60%, then deepens toward a stronger teal at 100%.
    const t = Math.max(0.2, Math.min(1, fatigue));
    return t < 0.6 ? grey.clone().lerp(aqua, t / 0.6) : aqua.clone().lerp(deep, (t - 0.6) / 0.4);
  };
  const position = [], color = [];
  const names = [];
  const emit = (poly, name) => { for (let i = 1; i + 1 < poly.length; i++) for (const p of [poly[0], poly[i], poly[i + 1]]) { position.push(...p); names.push(name); color.push(0, 0, 0); } };
  for (let f = 0; f < faces; f++) {
    const poly = [0, 1, 2].map(k => { const v = corner(f, k); return [points[v * 3], points[v * 3 + 1], points[v * 3 + 2]]; });
    const cut = cutOf.get(f);
    if (!cut) { emit(poly, facePart.get(f)); continue; }
    // Signed side of the cut line, measured in the back view with |x| so one line serves both sides.
    const [[x1, z1], [x2, z2]] = cut.line;
    const side = p => (x2 - x1) * (p[2] - z1) - (z2 - z1) * (Math.abs(p[0]) - x1);
    const above = [], below = [];
    poly.forEach((p, i) => {
      const q = poly[(i + 1) % 3], sp = side(p), sq = side(q);
      (sp >= 0 ? above : below).push(p);
      if ((sp > 0 && sq < 0) || (sp < 0 && sq > 0)) { const t = sp / (sp - sq), m = p.map((c, k) => c + (q[k] - c) * t); above.push(m); below.push(m); }
    });
    if (above.length >= 3) emit(above, cut.above);
    if (below.length >= 3) emit(below, cut.below);
  }
  const flat = new THREE.BufferGeometry();
  flat.setAttribute("position", new THREE.Float32BufferAttribute(position, 3));
  flat.setAttribute("color", new THREE.Float32BufferAttribute(color, 3));
  flat.computeVertexNormals();
  const material = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  // The model faces -Y: the front turns 30 degrees one way and the back the other, so the arms nearest the centre stay apart.
  [-YAW, Math.PI - YAW].forEach(yaw => { const m = new THREE.Mesh(flat, material); m.rotation.z = yaw; figures.add(m); });
  const colorAttr = flat.getAttribute("color");
  window.paintFatigue = () => {
    names.forEach((n, i) => { const c = colorOf(n); colorAttr.setXYZ(i, c.r, c.g, c.b); });
    colorAttr.needsUpdate = true; renderer.render(scene, camera);
  };
  window.paintFatigue();
  resize();
  // A sideways finger drag turns the figure under the finger (left half = front figure, right half = back figure);
  // vertical drags are left to the page scroll (touch-action: pan-y).
  let lastX = null, which = 0;
  stage.addEventListener("pointerdown", e => {
    lastX = e.clientX;
    const r = stage.getBoundingClientRect();
    which = e.clientX - r.left < r.width / 2 ? 0 : 1;
  });
  stage.addEventListener("pointermove", e => {
    if (lastX === null) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    figures.children[which].rotation.z += dx * 0.012;
    renderer.render(scene, camera);
  });
  const release = () => { lastX = null; };
  stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release); stage.addEventListener("pointerleave", release);
}
addEventListener("resize", resize);
load().catch(() => {});
</script>
