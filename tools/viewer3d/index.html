<main id="stage"><div id="empty"></div></main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const baseOf = n => n.split("~")[0];
// ---------- scene ----------
const stage = document.getElementById("stage");
const params = new URLSearchParams(location.search);
const SNAP = params.get("snap");   // ?snap=<act>: hand one still frame to the parent page (review sheets, thumbnail capture)
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer: !!SNAP });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const EX = params.get("ex");
scene.background = new THREE.Color(0x34322e);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// Contrast lighting: weak ambient so shaded faces go dark, a strong key from upper-left, a cool rim from behind. All lights ride on the
// camera, so the muscle shading looks the same from any orbit angle instead of washing flat when the view turns away from a world-fixed sun.
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x16161a, 0.3));
function camLight(color, intensity, x, y, z) { const l = new THREE.DirectionalLight(color, intensity); l.position.set(x, y, z); l.target.position.set(0, 0, -5); camera.add(l, l.target); }
camLight(0xffffff, 1.7, -3, 4, 2);      // key: upper-left of the viewer (kept under ~2 so the aqua does not clip to flat cyan)
camLight(0x9fb4ff, 0.4, 4, -1, 1);      // fill: soft from lower-right so the dark side is not black
camLight(0xffffff, 0.9, 1, 2, -4);      // rim: from behind the figure, edges the silhouette
const world = new THREE.Group(); scene.add(world);

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------- models ----------
const cache = {};      // name -> parsed data
let shown = [];        // [{name, group, objs:[{mesh, steps:[{p,q,s}]}], n}]
let exerciseModels, activeExercise = EX, defaultView;
let act = 0;
function validLoad(kg) { return Number.isFinite(kg) && kg >= 0 ? kg : null; }
const urlKg = params.get("kg");
let loadKg = urlKg?.trim() ? validLoad(Number(urlKg)) : null;
let loadTimer, loadRevision = 0, tickedRevision = -1;
let transition;
function commitLoad(animate) {
  clearTimeout(loadTimer);
  loadRevision++;
  if (transition) return;
  for (const m of shown) applyEquipmentLoad(m, loadKg, animate);
  for (const m of shown) pose(m, act); // Also updates a paused rep; never restart its clock or camera.
}
window.setLoad = (kg, animate = true) => {
  const next = validLoad(kg);
  if (next === loadKg && animate) return;
  loadKg = next;
  clearTimeout(loadTimer);
  if (!animate || !window.__ready || document.hidden) commitLoad(false);
  else loadTimer = setTimeout(() => commitLoad(!document.hidden), 350);
};
document.addEventListener('visibilitychange', () => { if (document.hidden) commitLoad(false); });
// ---------- seated avatar (poses measured by the human fit tests; three samples blended along act) ----------
let humanList = new Set(); const humanOn = true;
const humanCache = {};
const BONE_NAMES = ["pelvis", "spine_03", "neck_01"];   // bones the first view reads (see the q-view block below)
let v5Manifest, humanBasePromise;
async function loadHumanList() {
  const r = await fetch("human_v5/manifest.json");
  if (!r.ok) throw Error("V5 manifest missing");
  v5Manifest = await r.json();
  humanList = new Set(v5Manifest.clips.map(c => c.id));
}
function fetchHumanBase() {
  if (!humanBasePromise) humanBasePromise = (async () => {
    const r = await fetch("human_v5/base.json");
    if (!r.ok) throw Error("V5 base missing");
    const b = await r.json();
    return { points: new Float32Array(b.rest), tris: new Uint16Array(b.triangles), names: b.bone_names,
      joints: b.joints.flat(), weights: b.weights.flat() };
  })();
  return humanBasePromise;
}
function humanFrame(h, frame) {
  // Interpolation uses two adjacent frames. Even/odd banks cannot evict each other,
  // including on reversal, and decoding a new phase never allocates another vertex array.
  const banks = h.banks ||= [null, null], slot = frame % 2;
  const bank = banks[slot] ||= {frame:-1, out:new Float32Array(h.vertices * 3)};
  const out = bank.out;
  if (bank.frame === frame) return out;
  bank.frame = frame;
  const start = frame * out.length;
  for (let i = 0; i < out.length; i++) out[i] = h.minimum[i % 3] + h.quantized[start + i] * h.scale[i % 3];
  return out;
}
async function fetchHuman(machine) {
  if (humanCache[machine]) return humanCache[machine];
  if (!humanList.has(machine)) throw Error("V5 motion missing: " + machine);
  const [r, base] = await Promise.all([fetch(`human_v5/${encodeURIComponent(machine)}.bin`), fetchHumanBase()]);
  if (!r.ok) throw Error("V5 motion unavailable");
  const a = await r.arrayBuffer(), d = new DataView(a);
  if (a.byteLength < 40 || d.getUint32(0, true) !== 0x32504757) throw Error("invalid V5 cache");
  const n = d.getUint32(4, true), vertices = d.getUint32(8, true);
  if (!n || vertices * 3 !== base.points.length || a.byteLength !== 40 + n * 4 + n * vertices * 6) throw Error("invalid V5 size");
  const minimum = Array.from({length:3}, (_,i) => d.getFloat32(16+i*4,true));
  const scale = Array.from({length:3}, (_,i) => d.getFloat32(28+i*4,true));
  const acts = new Float32Array(n);
  for (let i=0;i<n;i++) acts[i] = d.getFloat32(40+i*4,true);
  if (minimum.some(x=>!Number.isFinite(x)) || scale.some(x=>!Number.isFinite(x)||x<=0) ||
      acts.some((x,i)=>!Number.isFinite(x)||i>0&&x<=acts[i-1])) throw Error("invalid V5 values");
  const quantized = new Uint16Array(n * vertices * 3), stride = vertices * 3;   // time-delta coded; Uint16 wraps, so the sum is exact
  for (let i=0;i<quantized.length;i++) quantized[i] = d.getUint16(40+n*4+i*2,true) + (i >= stride ? quantized[i-stride] : 0);
  const h = { acts, base, vertices, minimum, scale, quantized, format:"v5-point-cache" };
  const g = new THREE.BufferGeometry(), pos = new THREE.BufferAttribute(humanFrame(h,0).slice(),3);
  pos.setUsage(THREE.DynamicDrawUsage); g.setAttribute("position",pos); g.setIndex(new THREE.BufferAttribute(base.tris,1)); h.geom=g;
  return (humanCache[machine]=h);
}
function validatePhases(acts) {
  if (!acts || !acts.length) throw Error("empty animation phases");
  for (let i = 0; i < acts.length; i++) {
    if (!Number.isFinite(acts[i]) || acts[i] < 0 || acts[i] > 1 || (i && acts[i] <= acts[i - 1])) throw Error("invalid animation phases");
  }
  return acts;
}
function phaseBracket(acts, a, out) {
  if (!Number.isFinite(a)) throw Error("invalid animation phase");
  const n = acts.length;
  if (!n) throw Error("empty animation phases");
  if (a <= acts[0] || n === 1) { out.i=out.j=out.t=0; return out; }
  if (a >= acts[n - 1]) { out.i=out.j=n-1; out.t=0; return out; }
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (acts[mid] <= a) lo = mid; else hi = mid;
  }
  out.i=lo; out.j=hi; out.t=(a-acts[lo])/(acts[hi]-acts[lo]); return out;
}
function poseHuman(m, a) {
  const h = m.human; if (!h) return;
  const {i, j, t} = phaseBracket(h.acts, a, h.cursor ||= {});
  const A = humanFrame(h, i), B = humanFrame(h, j), P = h.geom.attributes.position.array;
  for (let k = 0; k < P.length; k++) P[k] = A[k] + (B[k] - A[k]) * t;
  h.geom.attributes.position.needsUpdate = true;
  if (m.watch) placeWatch(m.watch, P);
}

// ---------- left-wrist watch (human_v5/watch.json): a rigid part that follows three forearm vertices ----------
let watchPromise = null;
function fetchWatch() {
  if (!watchPromise) watchPromise = fetch("human_v5/watch.json").then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return null;
    const parts = d.parts.map(p => {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(p.verts, 3)); g.setIndex(p.tris);
      const ng = g.toNonIndexed(); ng.computeVertexNormals();
      return { geom: ng, color: p.color };
    });
    const r = d.anchor_rest, v = k => new THREE.Vector3(r[3 * k], r[3 * k + 1], r[3 * k + 2]);
    return { parts, anchors: d.anchors, rest: [v(0), v(1), v(2)], restBasis: anchorBasis(v(0), v(1), v(2)).transpose() };
  }).catch(() => null);
  return watchPromise;
}
const wa = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], wt = new THREE.Vector3();
const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), e3 = new THREE.Vector3();
function anchorBasis(p0, p1, p2, matrix = new THREE.Matrix4()) {
  e1.subVectors(p1,p0).normalize(); e2.subVectors(p2,p0);
  e2.addScaledVector(e1, -e2.dot(e1)).normalize();
  return matrix.makeBasis(e1, e2, e3.crossVectors(e1,e2));
}
function placeWatch(w, P) {
  for (let k=0; k<3; k++) wa[k].fromArray(P, 3*w.tpl.anchors[k]);
  const M = anchorBasis(wa[0], wa[1], wa[2], w.group.matrix).multiply(w.tpl.restBasis);
  wt.copy(w.tpl.rest[0]).applyMatrix4(M);
  M.setPosition(wa[0].x - wt.x, wa[0].y - wt.y, wa[0].z - wt.z);
}
function attachWatch(m, tpl) {
  const group = new THREE.Group(); group.matrixAutoUpdate = false;
  for (const p of tpl.parts) {
    const mesh = new THREE.Mesh(p.geom, new THREE.MeshLambertMaterial({ color: new THREE.Color(...p.color), flatShading: true }));
    mesh.frustumCulled = false; group.add(mesh);
  }
  group.visible = humanOn; m.group.add(group); m.watch = { group, tpl };
}

const LEGACY = new URLSearchParams(location.search).get("legacy") === "1";
let plateOverlays = {}, machineOverlays = {}, wgmClips = new Set(), wgmPartsPromise = null;
async function loadWgmManifest() {
  if (LEGACY) return;
  try {
    const r = await fetch("data/wgm_manifest.json");
    if (!r.ok) return;
    const m = await r.json();
    if (m && m.version === 2 && Array.isArray(m.clips)) {
      wgmClips = new Set(m.clips); plateOverlays = m.plateOverlays || {}; machineOverlays = m.machineOverlays || {};
    }
  } catch {}
}
function fetchWgmParts() {
  if (!wgmPartsPromise) wgmPartsPromise = (async () => {
    const r = await fetch("data/parts.bin");
    if (!r.ok) throw Error("WGC2 parts.bin missing");
    const a = await r.arrayBuffer(), d = new DataView(a);
    if (a.byteLength < 8 || d.getUint32(0, true) !== 0x32434757) throw Error("invalid WGC2 catalog");
    const count = d.getUint32(4, true), parts = new Array(count);
    let off = 8;
    for (let p = 0; p < count; p++) {
      const nv = d.getUint16(off, true), nt = d.getUint16(off + 2, true), flags = d.getUint8(off + 4);
      const mn0 = d.getFloat32(off + 8, true), mn1 = d.getFloat32(off + 12, true), mn2 = d.getFloat32(off + 16, true);
      const sc0 = d.getFloat32(off + 20, true), sc1 = d.getFloat32(off + 24, true), sc2 = d.getFloat32(off + 28, true);
      off += 32;
      const pos = new Float32Array(nv * 3);
      for (let i = 0; i < nv; i++) {
        pos[i * 3]     = mn0 + d.getUint16(off, true) * sc0;
        pos[i * 3 + 1] = mn1 + d.getUint16(off + 2, true) * sc1;
        pos[i * 3 + 2] = mn2 + d.getUint16(off + 4, true) * sc2;
        off += 6;
      }
      const idx = new Uint16Array(nt * 3);
      for (let i = 0; i < nt * 3; i++, off += 2) idx[i] = d.getUint16(off, true);
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      if (flags & 2) {
        const uv = new Float32Array(2 * nv);
        for (let k = 0; k < uv.length; k++, off += 2) uv[k] = d.getUint16(off, true) / 65535;
        g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      }
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      const smooth = !!(flags & 1);
      const out = smooth ? g : g.toNonIndexed();
      out.computeVertexNormals();
      parts[p] = { geom: out, smooth };
    }
    return parts;
  })();
  return wgmPartsPromise;
}
const LAT_STACK_LABEL = 9, PLATE_FACE = 10, PLYO_WOOD = 12;
let plateMapPromise, plateMap, smallPlateMap;
function loadPlateMap() {
  if (!plateMapPromise) {
    const loader = new THREE.TextureLoader();
    plateMapPromise = Promise.all(['plate_faces', 'plate_faces_extra'].map(name => loader.loadAsync('data/' + name + '.webp')))
      .then(([base, extra]) => {
        base.colorSpace = extra.colorSpace = THREE.SRGBColorSpace;
        // Upload the printed tiles once at load, never read pixels or rasterize fonts in a rep.
        renderer.initTexture(extra); smallPlateMap = extra;
        return base;
      });
  }
  return plateMapPromise;
}
let plyoWoodPromise, plyoWood;
function loadPlyoWood() {
  if (!plyoWoodPromise) plyoWoodPromise = new THREE.TextureLoader().loadAsync('data/plyo_wood.jpg').then(map => {
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    return map;
  });
  return plyoWoodPromise;
}
let latStackTexturePromise, latStackTexture;
async function loadLatStackTexture() {
  if (!latStackTexturePromise) latStackTexturePromise = (async () => {
    const r = await fetch('data/lat_stack_labels.svg');
    if (!r.ok) throw Error('missing stack label atlas');
    // The Android asset interceptor serves unknown extensions as octet-stream.
    const url = URL.createObjectURL(new Blob([await r.text()], { type: 'image/svg+xml' }));
    try {
      const map = await new THREE.TextureLoader().loadAsync(url);
      map.colorSpace = THREE.SRGBColorSpace;
      return map;
    } finally { URL.revokeObjectURL(url); }
  })();
  return latStackTexturePromise;
}

function addLatStackUV(geom) {
  if (geom.hasAttribute('uv')) return;
  geom.computeBoundingBox();
  const { min, max } = geom.boundingBox;
  const tile = min.z + max.z > 0 ? 0.5 : 0;
  const pos = geom.getAttribute('position'), uv = new Float32Array(2 * pos.count);
  for (let i = 0; i < pos.count; i++) {
    uv[2*i] = (pos.getX(i)-min.x)/(max.x-min.x);
    uv[2*i+1] = tile + 0.5 * (pos.getZ(i)-min.z)/(max.z-min.z);
  }
  geom.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

async function fetchWgmModel(name) {
  const [r, parts] = await Promise.all([fetch(`data/${encodeURIComponent(name)}.wgm`), fetchWgmParts()]);
  if (!r.ok) return null;
  const a = await r.arrayBuffer(), d = new DataView(a);
  if (a.byteLength < 8 || d.getUint32(0, true) !== 0x324D4757) throw Error("invalid WGM2 clip");
  const nActs = d.getUint16(4, true), nObjs = d.getUint16(6, true);
  let off = 8;
  const acts = new Array(nActs);
  for (let i = 0; i < nActs; i++, off += 4) acts[i] = d.getFloat32(off, true);
  validatePhases(acts);
  const parsed = new Array(nObjs);
  for (let o = 0; o < nObjs; o++) {
    const pid = d.getUint16(off, true);
    const cr = d.getUint8(off + 2) / 255, cg = d.getUint8(off + 3) / 255, cb = d.getUint8(off + 4) / 255;
    const mat = d.getUint8(off + 5), flags = d.getUint8(off + 6), nf = d.getUint16(off + 8, true);
    off += 10;
    let px = d.getFloat32(off, true), py = d.getFloat32(off + 4, true), pz = d.getFloat32(off + 8, true);
    let qx = d.getFloat32(off + 12, true), qy = d.getFloat32(off + 16, true), qz = d.getFloat32(off + 20, true), qw = d.getFloat32(off + 24, true);
    let sx = d.getFloat32(off + 28, true), sy = d.getFloat32(off + 32, true), sz = d.getFloat32(off + 36, true);
    off += 40;
    const steps = new Array(nf);
    steps[0] = { p: new THREE.Vector3(px, py, pz), q: new THREE.Quaternion(qx, qy, qz, qw).normalize(), s: new THREE.Vector3(sx, sy, sz) };
    if (nf > 1) {
      const dpOff = off; off += (nf - 1) * 6;
      const constScale = !!(flags & 1), constRot = !!(flags & 2);
      const dqOff = constRot ? 0 : off; if (!constRot) off += (nf - 1) * 8;
      const dsOff = constScale ? 0 : off; if (!constScale) off += (nf - 1) * 6;
      for (let f = 1; f < nf; f++) {
        const k = f - 1;
        px += d.getInt16(dpOff + k * 6, true) * 1e-4;
        py += d.getInt16(dpOff + k * 6 + 2, true) * 1e-4;
        pz += d.getInt16(dpOff + k * 6 + 4, true) * 1e-4;
        if (!constRot) {
          qx += d.getInt16(dqOff + k * 8, true) / 32767;
          qy += d.getInt16(dqOff + k * 8 + 2, true) / 32767;
          qz += d.getInt16(dqOff + k * 8 + 4, true) / 32767;
          qw += d.getInt16(dqOff + k * 8 + 6, true) / 32767;
        }
        if (!constScale) {
          sx += d.getInt16(dsOff + k * 6, true) * 1e-4;
          sy += d.getInt16(dsOff + k * 6 + 2, true) * 1e-4;
          sz += d.getInt16(dsOff + k * 6 + 4, true) * 1e-4;
        }
        steps[f] = { p: new THREE.Vector3(px, py, pz), q: new THREE.Quaternion(qx, qy, qz, qw).normalize(), s: new THREE.Vector3(sx, sy, sz) };
      }
    }
    const { geom, smooth } = parts[pid];
    if (mat === LAT_STACK_LABEL) {
      try { latStackTexture = await loadLatStackTexture(); }
      catch (e) { console.warn(e); return null; }
      addLatStackUV(geom);
    } else if (mat === PLATE_FACE) {
      if (!geom.hasAttribute('uv')) throw Error('missing plate UVs');
      plateMap = await loadPlateMap();
    } else if (mat === PLYO_WOOD) {
      plyoWood = await loadPlyoWood().catch(() => null);
    }
    parsed[o] = { geom, smooth, color: [cr, cg, cb], mat, steps };
  }
  return { acts, parsed, format: "wgm2" };
}

const SELECTOR_WINDOW = 8;
const BAR_KNURL = 11;
const isTransparentPreset = preset => preset === 5 || preset === SELECTOR_WINDOW;

function selectorWindowMaterial(color) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.21, metalness: 0, opacity: 0.27, transparent: true, depthWrite: false });
  // One front-facing layer. Approximate the gym's soft strip light in reflection space:
  // its glint travels across the pane as the camera orbits, without a transmission pass or texture.
  mat.onBeforeCompile = shader => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', `
      vec3 eye = normalize(vViewPosition);
      float grazing = smoothstep(0.0, 0.88, 1.0 - clamp(dot(normal, eye), 0.0, 1.0));
      vec3 ray = inverseTransformDirection(reflect(-eye, normal), viewMatrix);
      float strip = 1.0 - smoothstep(0.025, 0.18, abs(ray.z - 0.33 * ray.x - 0.11));
      diffuseColor.a = min(0.56, 0.27 + 0.24 * grazing + 0.08 * strip) * opacity / 0.27;
      outgoingLight += (opacity / 0.27) * vec3(0.085 * grazing + strip * (0.22 + 0.20 * grazing));
      #include <opaque_fragment>`);
  };
  return mat;
}

function barKnurlMaterial(color) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.29, metalness: 0.58 });
  mat.onBeforeCompile = shader => {
    shader.vertexShader = 'varying vec3 vBarLocal;\n' + shader.vertexShader
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvBarLocal = position;');
    shader.fragmentShader = 'varying vec3 vBarLocal;\n' + shader.fragmentShader
      .replace('#include <normal_fragment_maps>', `
        #include <normal_fragment_maps>
        // E_knurl uses the minimum of two crossed ping-pong waves as bump height.
        float turn = atan(vBarLocal.y, vBarLocal.x) / 6.28318530718;
        vec2 phase = vec2(36.0 * turn) + vec2(-350.0, 350.0) * vBarLocal.z;
        vec2 ridge = 0.5 - abs(fract(phase) - 0.5);
        float height = min(ridge.x, ridge.y) * 0.00065 * 0.55;
        float fade = 1.0 - smoothstep(0.35, 0.75, max(fwidth(phase.x), fwidth(phase.y)));
        vec3 dx = dFdx(-vViewPosition), dy = dFdy(-vViewPosition);
        vec3 rx = cross(dy, normal), ry = cross(normal, dx);
        float det = dot(dx, rx) * faceDirection;
        vec3 grad = sign(det) * (dFdx(height) * rx + dFdy(height) * ry);
        normal = normalize(max(abs(det), 1e-10) * normal - fade * grad);
      `);
  };
  return mat;
}

function plyoWoodMaterial(color) {
  if (!plyoWood) return new THREE.MeshStandardMaterial({ color, roughness: 0.52, flatShading: true });
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.52, flatShading: true });
  mat.onBeforeCompile = shader => {
    shader.uniforms.plyoGrain = { value: plyoWood };
    shader.vertexShader = 'varying vec3 vPlyoLocal;\n' + shader.vertexShader
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPlyoLocal = position;');
    shader.fragmentShader = 'uniform sampler2D plyoGrain;\nvarying vec3 vPlyoLocal;\n' + shader.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 p = vPlyoLocal * 1.2;
        vec3 axis = pow(abs(normalize(cross(dFdx(p), dFdy(p)))), vec3(5.0));
        axis /= dot(axis, vec3(1.0));
        vec3 grain = texture2D(plyoGrain, p.yz).rgb * axis.x
          + texture2D(plyoGrain, p.xz).rgb * axis.y
          + texture2D(plyoGrain, p.xy).rgb * axis.z;
        float value = max(grain.r, max(grain.g, grain.b));
        diffuseColor.rgb *= mix(vec3(value), grain, 0.84) * 1.28;
      `);
  };
  return mat;
}

function makePresetMaterial(preset, rgb, smooth, texture) {
  const color = new THREE.Color(rgb[0], rgb[1], rgb[2]);
  if (!preset) return new THREE.MeshLambertMaterial({ color, flatShading: !smooth });
  switch (preset) {
    case 1: return new THREE.MeshStandardMaterial({ color, roughness: 0.52, metalness: 0.28, flatShading: !smooth });
    case 2: return new THREE.MeshStandardMaterial({ color, roughness: 0.36, metalness: 0.42, flatShading: !smooth });
    case 3: return new THREE.MeshStandardMaterial({ color, roughness: 0.22, metalness: 0.58, flatShading: !smooth });
    case 4: return new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0.05, flatShading: !smooth });
    // Closed 4 mm sheets: draw only the facing surface, with no second tinted layer behind it.
    case 5: return new THREE.MeshStandardMaterial({ color, roughness: 0.19, metalness: 0.02, transparent: true, opacity: 0.18, depthWrite: false });
    case 6: return new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.04, flatShading: !smooth });
    case 7: return new THREE.MeshStandardMaterial({ color, roughness: 0.32, metalness: 0.45, flatShading: !smooth });
    case PLATE_FACE: return new THREE.MeshStandardMaterial({ map: texture || plateMap, roughness: 0.55, metalness: 0 });
    case BAR_KNURL: return barKnurlMaterial(color);
    case PLYO_WOOD: return plyoWoodMaterial(color);
    case SELECTOR_WINDOW: return selectorWindowMaterial(color);
    case LAT_STACK_LABEL: return new THREE.MeshStandardMaterial({ map: latStackTexture, roughness: 0.9, alphaTest: 0.5 });
    default: return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.25, flatShading: !smooth });
  }
}

function mergeStaticNonIndexed(items, atlasUV = false) {
  let totalVerts = 0;
  const baked = items.map(({ geom, matrix }) => {
    const g = (geom.index ? geom.toNonIndexed() : geom.clone());
    g.applyMatrix4(matrix);
    totalVerts += g.attributes.position.count;
    return g;
  });
  const pos = new Float32Array(totalVerts * 3), norm = new Float32Array(totalVerts * 3);
  const uv = atlasUV ? new Float32Array(totalVerts * 2) : null;
  let off = 0;
  for (const g of baked) {
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    pos.set(p, off); norm.set(n, off);
    if (uv) uv.set(g.attributes.uv.array, off / 3 * 2);
    off += p.length;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(norm, 3));
  if (uv) out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return out;
}

function parse(d) {
  validatePhases(d.acts);
  const objs = d.objects.map(o => {
    if (!o.m.length) throw Error("invalid equipment frame count");
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(o.verts, 3));
    g.setIndex(o.tris);
    const ng = g.toNonIndexed(); ng.computeVertexNormals();
    const steps = o.m.map(a => { const m = new THREE.Matrix4().fromArray(a); const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); m.decompose(p, q, s); return { p, q, s }; });
    return { geom: ng, smooth: false, color: o.color, mat: 0, steps, source: o };
  });
  return { ...d, parsed: objs };
}

function mergePlateOverlay(raw, overlay, targets, count = Object.keys(targets).length * 2, covered = {}) {
  const replaced = Object.entries(targets);
  const hidden = Object.entries(covered);
  if (!Number.isInteger(count) || count < replaced.length || overlay.parsed.length !== count || overlay.acts.length !== raw.acts.length ||
      overlay.acts.some((a,i) => a !== Math.fround(raw.acts[i])) ||
      [...replaced, ...hidden].some(([i,name]) => raw.objects[i]?.name !== name) ||
      hidden.some(([i]) => i in targets)) throw Error('stale plate overlay');
  const base = parse({ ...raw, objects: raw.objects.filter((o,i) => !(i in targets || i in covered)) });
  for (const part of base.parsed) part.legacy = true;
  return { ...base, loadSource: raw.objects, overlayParts: overlay.parsed,
           format: 'wgm2', parsed: [...base.parsed, ...overlay.parsed] };
}

async function fetchModel(name) {
  let rawPromise;
  const raw = () => rawPromise ||= fetch(`data/${name}.json`).then(r => r.ok ? r.json() : null);
  if (!LEGACY && wgmClips.has(name)) {
    try {
      if (plateOverlays[name] || machineOverlays[name]) {
        const [original, overlay] = await Promise.all([raw(), fetchWgmModel(name)]);
        if (original && overlay) {
          const batch = machineOverlays[name];
          return mergePlateOverlay(original, overlay, batch ? batch.targets : plateOverlays[name], batch?.count, batch?.covered);
        }
      } else {
        const w = await fetchWgmModel(name);
        if (w) return w;
      }
    } catch (e) { console.warn('Using original equipment:', name, e); }
  }
  const d = await raw();
  return d && parse(d);
}

function buildGroup(d) {
  const group = new THREE.Group();
  const objs = [];
  const staticBuckets = new Map(), movingBuckets = new Map(), instances = [];
  const mergedGeometries = [];
  function addSingle(o) {
    const mesh = new THREE.Mesh(o.geom, makePresetMaterial(o.mat, o.color, o.smooth, o.texture));
    if (isTransparentPreset(o.mat)) mesh.renderOrder = 2;
    mesh.matrixAutoUpdate = false;
    group.add(mesh);
    objs.push({ mesh, steps: o.steps });
  }
  for (const o of d.parsed) {
    if (o.legacy || (o.mat === BAR_KNURL && o.steps.length === 1)) { addSingle(o); continue; }
    if (d.format === "wgm2" && o.steps.length === 1) {
      const key = `${o.mat}|${Math.round(o.color[0]*255)},${Math.round(o.color[1]*255)},${Math.round(o.color[2]*255)}|${o.smooth?1:0}|${o.texture?.uuid || ''}`;
      if (!staticBuckets.has(key)) staticBuckets.set(key, { mat: o.mat, color: o.color, smooth: o.smooth, texture: o.texture, items: [] });
      const m = new THREE.Matrix4().compose(o.steps[0].p, o.steps[0].q, o.steps[0].s);
      staticBuckets.get(key).items.push({ geom: o.geom, matrix: m });
    } else if (d.format === "wgm2" && !isTransparentPreset(o.mat) && o.steps.every(k => k.s.x > 0 && k.s.y > 0 && k.s.z > 0)) {
      // Share the draw, not the track: each plate / rope link keeps its original motion.
      const key = [o.geom.uuid, o.mat, ...o.color].join('|');
      if (!movingBuckets.has(key)) movingBuckets.set(key, []);
      movingBuckets.get(key).push(o);
    } else addSingle(o);
  }
  for (const bucket of movingBuckets.values()) {
    const first = bucket[0];
    if (bucket.length === 1) { addSingle(first); continue; }
    const mesh = new THREE.InstancedMesh(first.geom, makePresetMaterial(first.mat, first.color, first.smooth, first.texture), bucket.length);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    group.add(mesh);
    instances.push(mesh);
    bucket.forEach((o, slot) => objs.push({ mesh, slot, steps: o.steps }));
  }
  for (const b of staticBuckets.values()) {
    const geom = mergeStaticNonIndexed(b.items, b.mat === LAT_STACK_LABEL || b.mat === PLATE_FACE);
    mergedGeometries.push(geom);
    const mat = makePresetMaterial(b.mat, b.color, b.smooth, b.texture);
    const mesh = new THREE.Mesh(geom, mat);
    if (isTransparentPreset(b.mat)) mesh.renderOrder = 2;
    group.add(mesh);
  }
  return { group, objs, instances, mergedGeometries, parts:d.parsed };
}

// ---------- set load: use the baked equipment only as a reference ----------
const UP = new THREE.Vector3(0, 0, 1);
const partBase = part => part.name.replace(/\.\d+$/, '');
const stackPlate = /^(?:(?:selected|rest|resting|unselected)_(?:plate|weight)(?:_\d+)?|mopt_(?:fixed|selected)_plate_\d+|weight(?:_plate)?|slab)$/;
const stackPin = /^(?:selector(?:_pin(?:_shaft|_knob)?|_grip)?|pin)$/;
const stackRod = /^(?:selector_(?:rod|stem|lift_rod)|rod)$/;
const sleeveName = /^(?:sleeve|horn|loading_sleeve|load_sleeve|horn_sleeve|plate_sleeve|loading_horn(?:_-?1)?|load_horn|plate_horn|pendulum_loading_horn)$/;
const collarName = /^(?:collar|plate_collar|sleeve_collar|locking_collar|pendulum_plate_collar)$/;
const freePlate = /^(?:plate|bumper(?:_plate)?|light_plate|weight_plate|loaded_plate(?:_-?1)?|loaded_45lb_plate|light_back_plate|plate_\d+kg|pendulum_loading_plate)$/;
const barClip = /^(?:smith_|ez_|barbell_|.*_barbell(?:_|$)|(?:flat|close_grip)_bench_press$|(?:conventional|sumo|trap_bar|stiff_leg)_deadlift$|(?:box|front|overhead|zercher)_squat$|(?:drag|reverse|wrist|reverse_wrist)_curl$|bradford_press$|rack_pull$|good_morning$|guillotine_press$|jm_press$|push_press$|thruster$|power_clean$|hang_clean$|snatch$|seal_row$|(?:single_arm_)?landmine_(?:shoulder_)?press$)/;
const discSpecs = [
  { kg: 20, diameter: .450, thick: .042 },
  { kg: 15, diameter: .400, thick: .036 },
  { kg: 10, diameter: .325, thick: .027 },
  { kg: 5, diameter: .230, thick: .019 },
  { kg: 2.5, diameter: .190, thick: .015 },
  { kg: 1.25, diameter: .160, thick: .012 },
  { kg: 1, diameter: .150, thick: .010 },
];
// One side's plates: the exact 0.25 kg-rounded load with the fewest plates (heaviest first), or the
// closest lighter load when no exact mix exists (e.g. 0.75 kg). null when absurdly heavy.
function platesFor(sideKg) {
  const units = Math.round(sideKg / .25);
  if (units > 4000) return null;
  const step = discSpecs.map(s => Math.round(s.kg / .25));
  const best = new Array(units + 1).fill(Infinity), pick = new Array(units + 1).fill(-1);
  best[0] = 0;
  for (let u = 1; u <= units; u++) step.forEach((w, i) => {
    if (w <= u && best[u - w] + 1 < best[u]) { best[u] = best[u - w] + 1; pick[u] = i; }
  });
  let u = units;
  while (u > 0 && best[u] === Infinity) u--;
  const out = [];
  for (; u > 0; u -= step[pick[u]]) out.push(discSpecs[pick[u]]);
  return out.sort((a, b) => b.kg - a.kg);
}
const geometryBox = geom => {
  if (!geom.boundingBox) geom.computeBoundingBox();
  return geom.boundingBox;
};
function rawBounds(o) {
  const matrix = new THREE.Matrix4().fromArray(o.m[0]);
  const box = new THREE.Box3(), point = new THREE.Vector3();
  for (let i = 0; i < o.verts.length; i += 3) box.expandByPoint(point.fromArray(o.verts, i).applyMatrix4(matrix));
  return box;
}
function loadBounds(part) {
  const { p, q, s } = part.steps[0];
  return geometryBox(part.geom).clone().applyMatrix4(new THREE.Matrix4().compose(p, q, s));
}
const boxCenter = b => b.getCenter(new THREE.Vector3());
const boxSize = b => b.getSize(new THREE.Vector3());
const xyDistance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function staticPart(geom, color, mat, p, q = new THREE.Quaternion()) {
  return { geom, color, mat, smooth: true, steps: [{ p, q, s: new THREE.Vector3(1, 1, 1) }] };
}

function stackLoadPlan(d, raw, parts) {
  // Named JSON plates and pin variants identify each independent tower. The finished
  // lat catalog has no WGM names, but its 28 castings share one geometry beside the atlas.
  const atlas = parts.filter(r => r.part.mat === LAT_STACK_LABEL);
  const named = raw.filter(r => stackPlate.test(r.name));
  const pins = raw.filter(r => stackPin.test(r.name) && r.source.m.length > 1);
  if (!atlas.length && (!named.length || !pins.length)) return null;
  const decks = [];
  const candidates = atlas.length ? parts.filter(r => {
    const label = boxCenter(atlas[0].box);
    const { x, y, z } = r.size;
    return x > .30 && y > .24 && z > .025 && z < .06 &&
      Math.abs(r.center.x - label.x) < .04 && r.center.y > label.y && r.center.y - label.y < .20;
  }) : named;
  for (const plate of candidates) {
    const deck = decks.find(d => xyDistance(d[0].center, plate.center) < .022);
    if (deck) deck.push(plate); else decks.push([plate]);
  }
  const remove = new Set(atlas.map(r => r.part));
  const towers = [];
  for (const deck of decks) {
    if (deck.length < 4) return null;
    const sorted = deck.sort((a, b) => b.center.z - a.center.z);
    const plates = atlas.length ? sorted : sorted.map(r => parts.find(f =>
      (f.part.source === r.source || f.center.distanceTo(r.center) < .006 && f.size.distanceTo(r.size) < .028) &&
      f.size.z < .11));
    if (plates.some(r => !r) || new Set(plates).size !== sorted.length) return null;
    const leader = plates.find(r => r.part.steps.length > 1);
    if (!leader) continue;    // an unused tower on a one-arm exercise stays as baked
    const { center } = leader;
    const bottom = plates.at(-1);
    const distances = plates.slice(1).map((r, i) => plates[i].center.z - r.center.z).sort((a, b) => a - b);
    const pitch = distances[Math.floor(distances.length / 2)];
    if (pitch < .020 || pitch > .15 || distances[0] < pitch - .018 ||
      plates.some(r => r.size.z > pitch + .004)) return null;
    const track = leader.part.steps;
    const lowestLift = Math.min(...track.map(t => t.p.z - track[0].p.z));
    const topZ = Math.max(...plates.map(r => r.center.z + (r.part.steps.length > 1 ? lowestLift : 0)));
    const linked = parts.filter(r => r.part.steps.length === track.length && r.part.steps.length > 1 &&
      r.part.steps.every((step, i) => step.p.clone().sub(r.part.steps[0].p)
        .distanceToSquared(track[i].p.clone().sub(track[0].p)) < .000004));
    const anchor = plates.filter(r => r.part.steps.length > 1).at(-1);
    const pinParts = linked.filter(r => {
      if (atlas.length) return Math.abs(r.center.z - anchor.center.z) < .026 &&
        Math.abs(r.center.x - center.x) < .065 && r.center.y < anchor.box.min.y &&
        r.center.y > anchor.box.min.y - .11 && r.size.z < .07;
      return Math.abs(r.center.x - center.x) < anchor.size.x / 2 + .14 &&
        Math.abs(r.center.y - center.y) < anchor.size.y / 2 + .14 &&
        pins.some(p => r.part.source === p.source || r.center.distanceTo(p.center) < .028);
    });
    if (!pinParts.length) return null;
    const pin = pinParts.find(r => !r.part.source || !/knob|grip/.test(partBase(r.part.source))) || pinParts[0];
    // Some older pin models stop exactly at the casting face. Seat their tip a
    // few mm into the face while keeping the handle on the same side.
    const pinBox = new THREE.Box3();
    for (const r of pinParts) pinBox.union(r.box);
    const insertion = new THREE.Vector3();
    for (const axis of ['x', 'y']) {
      const depth = Math.min(pinBox.max[axis], anchor.box.max[axis]) -
        Math.max(pinBox.min[axis], anchor.box.min[axis]);
      if (depth < .003) insertion[axis] = Math.sign(center[axis] - pin.center[axis]) * (.003 - depth);
    }
    // Printed baked numbers describe the original plate weights. Their flat overlays
    // must go with the original castings when the live 5 kg stack replaces them.
    for (const r of parts) {
      if (plates.includes(r) || pinParts.includes(r) || sorted.some(p =>
        r.size.y < .004 && r.size.x > .045 && r.size.x < p.size.x &&
        r.size.z < p.size.z && Math.abs(r.center.x - p.center.x) < p.size.x * .35 &&
        Math.abs(r.center.z - p.center.z) < .019 &&
        Math.min(Math.abs(r.center.y - p.box.min.y), Math.abs(r.center.y - p.box.max.y)) < .014)) remove.add(r.part);
    }
    const rod = linked.find(r => r.part.source && stackRod.test(partBase(r.part.source)) &&
      xyDistance(r.center, center) < .043);
    const count = Math.max(20, plates.length);
    // An older tower can only fit 20 castings if the row pitch is reduced.
    // Keep both ends inside its original envelope, including throughout the lift.
    const rowPitch = Math.min(pitch, (topZ - bottom.center.z) / (count - 1));
    if (rowPitch < .014) return null;
    // Pull straight through the casting face on which the actual grip is mounted.
    const axis = Math.abs((pin.center.x-center.x)/anchor.size.x) > Math.abs((pin.center.y-center.y)/anchor.size.y) ? 'x' : 'y';
    const outward = new THREE.Vector3();
    outward[axis] = Math.sign(pin.center[axis] - center[axis]) || 1;
    const penetration = outward[axis] > 0 ? anchor.box.max[axis] - pinBox.min[axis] - insertion[axis]
      : pinBox.max[axis] + insertion[axis] - anchor.box.min[axis];
    outward.multiplyScalar(Math.max(.085, penetration + .045));
    towers.push({ plates, pitch, rowPitch, count, topZ, lowestLift, track, pinParts, pin, insertion, rod, outward });
  }
  return towers.length ? { kind: 'stack', remove, towers } : null;
}

function rawCylinder(row, useThickness = false) {
  const source = row.source;
  const local = new THREE.Box3(), point = new THREE.Vector3();
  for (let i = 0; i < source.verts.length; i += 3) local.expandByPoint(point.fromArray(source.verts, i));
  const size = boxSize(local);
  const dims = [size.x, size.y, size.z].map((extent, i) => ({ i, extent })).sort((a, b) => a.extent - b.extent);
  const i = (useThickness ? dims[0] : dims[2]).i;
  const m = new THREE.Matrix4().fromArray(source.m[0]);
  const vector = j => new THREE.Vector3().setFromMatrixColumn(m, j);
  const length = dims.find(d => d.i === i).extent * vector(i).length();
  const diameter = Math.max(...dims.filter(d => d.i !== i).map(d => d.extent * vector(d.i).length()));
  return { center: boxCenter(local).applyMatrix4(m), axis: vector(i).normalize(), length, diameter };
}

// Atlas cells use WebGL's bottom-left origin. The first cell on the bottom
// row is the 5 kg bumper; the other three bottom cells are cast iron.
const bumperPlateCells = { 20: 5, 15: 6, 10: 7, 5: 0 };
const ironPlateCells = { 20: 1, 10: 2, 5: 3 };
// Same resolution as the base atlas. Seven lossless tiles of the old printed faces.
const extraBumperCells = { 2.5: 4, 1.25: 5, 1: 6 }, extraIronCells = { 15: 0, 2.5: 1, 1.25: 2, 1: 3 };
function finishPlateFace(geom, kg) {
  const uv = geom.getAttribute('uv');
  const col = Math.floor(uv.getX(0) * 4), row = Math.floor(uv.getY(0) * 2);
  const iron = row === 0 && col !== 0;
  const target = (iron ? ironPlateCells : bumperPlateCells)[kg];
  if (target === col + 4 * row) return;
  const cell = target ?? (iron ? extraIronCells : extraBumperCells)[kg];
  for (let i = 0; i < uv.count; i++) {
    const u = uv.getX(i) * 4 - col, v = uv.getY(i) * 2 - row;
    uv.setXY(i, (u + cell % 4) / 4, (v + Math.floor(cell / 4)) / 2);
  }
  return target === undefined ? smallPlateMap : undefined;
}

function fitDiscGeometry(part, radius, bore, axialScale, hub) {
  const geom = part.geom.clone();
  const a = geom.getAttribute('position');
  const oldR = boxSize(geometryBox(part.geom)).x / 2;
  for (let v = 0; v < a.count; v++) {
    const x = a.getX(v), y = a.getY(v), r = Math.hypot(x, y);
    const next = hub ? THREE.MathUtils.lerp(bore, .05, THREE.MathUtils.clamp((r - .0262) / (.05 - .0262), 0, 1))
      : THREE.MathUtils.lerp(.05, radius, THREE.MathUtils.clamp((r - .05) / (oldR - .05), 0, 1));
    a.setXYZ(v, x * next / r, y * next / r, a.getZ(v) * axialScale);
  }
  geom.computeVertexNormals();
  geom.computeBoundingBox();
  return geom;
}

function ringGeometry(inner, outer, width) {
  const profile = [[inner, -.5], [outer - .002, -.5], [outer, -.44], [outer, .44],
    [outer - .002, .5], [inner, .5], [inner, -.5]].map(([r, h]) => new THREE.Vector2(r, h * width));
  return new THREE.LatheGeometry(profile, 36).rotateX(Math.PI / 2);
}

const standWidth = .064, standTipGap = .006, standHardwareGap = .012;
function sleeveStand(sleeve, direction) {
  const along = sleeve.axis.clone().multiplyScalar(direction);
  const contact = sleeve.center.clone().addScaledVector(along, sleeve.length / 2 - standTipGap - standWidth / 2);
  const height = sleeve.row.box.min.z;
  contact.z = height / 2;
  const rotation = new THREE.Quaternion().setFromAxisAngle(UP, Math.atan2(along.y, along.x));
  return { ...staticPart(new THREE.BoxGeometry(standWidth, .20, height), [.082, .074, .063], 4,
    contact, rotation), ownedGeometry: true };
}

function plateLoadPlan(name, d, raw, parts) {
  const sleeves = raw.filter(r => sleeveName.test(r.name)).map(row => ({ row, ...rawCylinder(row), plates: [] }));
  if (!sleeves.length) return null;
  const overlayNames = plateOverlays[name] || {};
  const plateSources = Object.keys(overlayNames).map(i => (d.loadSource || d.objects)[i]);
  // The plate overlay is the prefix of WGM. Every original plate becomes a matched rubber body / metal hub pair.
  const sourcePairs = new Map(plateSources.map((source, i) => [source, d.overlayParts?.slice(2 * i, 2 * i + 2)]));
  const possible = raw.filter(r => !/^(?:free|stored|dip)_/.test(r.name) &&
    (sourcePairs.has(r.source) || freePlate.test(r.name)) && r.source.m.length > 1);
  for (const row of possible) {
    const disc = rawCylinder(row, true);
    if (disc.diameter < .16 || disc.length > .14) continue;
    const sleeve = sleeves.find(s => {
      const delta = disc.center.clone().sub(s.center), along = delta.dot(s.axis);
      return Math.abs(disc.axis.dot(s.axis)) > .98 && Math.abs(along) < s.length / 2 + .025 &&
        delta.addScaledVector(s.axis, -along).length() < .018;
    });
    if (sleeve) sleeve.plates.push({ row, ...disc });
  }
  const loaded = sleeves.filter(s => s.plates.length);
  if (!loaded.length || loaded.length > 2 || loaded.reduce((sum, s) => sum + s.plates.length, 0) !== possible.length) return null;
  const remove = new Set();
  const groups = [];
  const totalBarKg = barClip.test(name) ? 20 : 0;
  for (const sleeve of loaded) {
    const { plates, axis, length, center } = sleeve;
    // A long horn and its mounting collar are parts of the machine. Only short,
    // concentric hardware is replaced, and only when it is on the loading sleeve.
    const hardware = raw.filter(r => collarName.test(r.name) || /^(?:plate_)?hub$/.test(r.name)).filter(r => {
      const d = rawCylinder(r, true), delta = d.center.clone().sub(center), along = delta.dot(axis);
      return d.length < .085 && Math.abs(d.axis.dot(axis)) > .97 && Math.abs(along) < length / 2 + .025 &&
        delta.addScaledVector(axis, -along).length() < .018;
    });
    const first = plates[0];
    const offsets = plates.map(p => p.center.clone().sub(center).dot(axis));
    const collar = hardware.find(r => collarName.test(r.name));
    const direction = collar ? Math.sign(collar.center.clone().sub(first.center).dot(axis)) :
      -Math.sign(offsets.reduce((sum, x) => sum + x, 0));
    if (!direction) return null;

    const arm = /^(upperarm|lowerarm|hand)_/.test(name);
    return {p:p.clone(), q:q.clone().slerp(neutral.local[i].q,open ? .6 : arm ? .25 : 0)};
  });
  const nodes = worldPose(rig,local,poseNodes(rig));
  const points = new Float32Array(rig.base.points.length);
  skinMorph(rig,source,source,nodes,0,points);
  return {...source, local, nodes, points, floor:meshFloor(points)};
}

function makeMorphRoute(rig, from, to, sourceName, hasA, keepDumbbells) {
  const a = posture(from), b = posture(to);
  const yawA = poseHeading(from), yawB = poseHeading(to);
  const neutral = (pose,yaw,clearance=0) => {
    const center = pose.nodes[0].p.clone().addScaledVector(new THREE.Vector3(Math.sin(yaw),-Math.cos(yaw),0),-clearance);
    return standingMorphPose(rig,center,yaw);
  };
  const poses = [from], times = [0];
  const add = (at,pose) => { times.push(at); poses.push(pose); };
  const mountA = a === "low" || a === "reclined";
  const mountB = b === "low" || b === "reclined";
  if (hasA && !keepDumbbells && (mountA || a === "floor")) {
    add(.10,releaseGripPose(rig,from,neutral(from,yawA)));
  }
  if (a === "reclined") add(.235,benchSeatPose(rig,from,neutral(from,yawA),yawA));
  const bigFloorChange = a === "floor" && b === "floor"
    && from.nodes[3].q.angleTo(to.nodes[3].q) > 1.05;
  if (mountA || (a === "floor" && mountB) || bigFloorChange) {
    const exit = a === "reclined" ? -.16 : sourceName.startsWith("lat_pulldown") ? .29 : -.14;
    add(a === "reclined" ? .43 : .37,neutral(from,yawA,exit));
  }
  const walkOut = a === "low" && b === "standing" && sourceName.startsWith("chest_press");
  if (walkOut) add(.62,neutral(from,yawA,-.84));
  if (b === "low") add(mountA ? .62 : .50,neutral(to,yawB,.17));
  if (b === "reclined") add(mountA || a === "floor" ? .745 : .63,benchSeatPose(rig,to,neutral(to,yawB),yawB));
  if (b === "reclined") add(.88,releaseGripPose(rig,to,neutral(to,yawB)));
  add(.985,to);
  return {rig, poses, times, a, b, walkOut, local:poseNodes(rig), world:poseNodes(rig)};
}

// Keep an ankle near its contact point, with staggered steps for a change of
// stance. Resolve the two-link leg in its interpolated knee plane.
function placeMorphFeet(rig, nodes, a, b, t, stepHeight) {
  const target = new THREE.Vector3(), axis = new THREE.Vector3(), bend = new THREE.Vector3();
  const thigh = new THREE.Vector3(), shin = new THREE.Vector3(), delta = new THREE.Vector3();
  const turn = new THREE.Quaternion();
  for (const [side,[h,k,f,toe]] of rig.legs.entries()) {
    const start = a.nodes[f].p, end = b.nodes[f].p;
    if (start.z-a.floor > .18 || end.z-b.floor > .18) continue;
    const hip = nodes[h], knee = nodes[k], foot = nodes[f];
    const step = Math.hypot(end.x-start.x,end.y-start.y) > .085;
    const u = step ? ramp(t,side === 0 ? .06 : .28,side === 0 ? .71 : .94) : t;
    target.lerpVectors(start,end,smooth(u));
    if (step) target.z += stepHeight*Math.sin(Math.PI*u)**2;
    thigh.subVectors(knee.p,hip.p); shin.subVectors(foot.p,knee.p);
    const l1 = thigh.length(), l2 = shin.length();
    axis.subVectors(target,hip.p);
    const reach = axis.length();
    if (reach < 1e-5 || l1 < 1e-5 || l2 < 1e-5) continue;
    axis.divideScalar(reach);
    const d = Math.min(l1+l2-1e-6,Math.max(Math.abs(l1-l2)+1e-6,reach));
    const x = (l1*l1-l2*l2+d*d)/(2*d);
    bend.copy(thigh).addScaledVector(axis,-thigh.dot(axis));
    if (bend.lengthSq() < 1e-8) continue;
    bend.setLength(Math.sqrt(Math.max(0,l1*l1-x*x)));
    target.copy(hip.p).addScaledVector(axis,d);
    knee.p.copy(hip.p).addScaledVector(axis,x).add(bend);
    hip.q.premultiply(turn.setFromUnitVectors(thigh.normalize(),delta.subVectors(knee.p,hip.p).normalize()));
    knee.q.premultiply(turn.setFromUnitVectors(shin.normalize(),delta.subVectors(target,knee.p).normalize()));
    nodes[toe].p.add(delta.subVectors(target,foot.p));
    foot.p.copy(target);
  }
}

function drawMorph(route, t, attribute) {
  const {rig,poses,times,local,world:nodes} = route;
  const end = times.findIndex(x => x >= t);
  const start = Math.max(0,(end < 0 ? poses.length-1 : Math.max(1,end))-1);
  const a = poses[start], b = poses[start+1];
  // Ease into each change of support, carrying a little speed through the waypoint.
  const u = unit((t-times[start])/(times[start+1]-times[start]));
  const k = .18*u + .82*smooth(u);
  for (let i = 0; i < local.length; i++) {
    local[i].p.lerpVectors(a.local[i].p,b.local[i].p,k);
    local[i].q.slerpQuaternions(a.local[i].q,b.local[i].q,k);
  }
  worldPose(rig,local,nodes);
  const P = attribute.array;
  if (t === 0 || t >= times.at(-1)) P.set(poses[t === 0 ? 0 : poses.length-1].points);
  else {
    const stepHeight = route.walkOut && times[start+1] === .62 ? .18 : .038;
    placeMorphFeet(rig,nodes,a,b,k,stepHeight);
    skinMorph(rig,a,b,nodes,k,P);
    // Prevent the interpolation from sinking below the two clips' contact floor.
    const correction = Math.max(0,mix(a.floor,b.floor,k)-meshFloor(P));
    for (let i = 2; i < P.length; i += 3) P[i] += correction;
    for (const node of nodes) node.p.z += correction;
  }
  attribute.needsUpdate = true;
}

// ---------- rep playback ----------
let anim = null, looping = true;
const REP = 2600; // ms for one full rep: 0 -> 1 -> 0
function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
const ALT_MIRROR = new Set(["alternating_dumbbell_curl", "alternating_hammer_curl"]);   // one arm per rep: the way back is the mirrored (other) arm
function repMeta() { return shown[0]?.repMeta; }
function repMs() { return repMeta()?.playback_ms || (shown.length===1 && ALT_MIRROR.has(shown[0].name) ? REP*2 : REP); }
const fullRep = [0,1];
function repRange() { return repMeta()?.playback_range || fullRep; }
function playRep(now = performance.now()) { setAct(repRange()[0]); anim = { t0:now }; }

const MORPH_MS = 2000;
let pendingExercise;

function transitionEquipment(model, phase) {
  const cursor = {}, matrix = new THREE.Matrix4();
  return model.equipment.parts.map(part => {
    const n = part.steps.length;
    const steps = n === 1 ? {i:0,j:0,t:0} : n === model.acts?.length ? phaseBracket(model.acts,phase,cursor)
      : phaseBracket(part.steps.map((_,i) => i/(n-1)),phase,cursor);
    const {i,j,t} = steps, a = part.steps[i], b = part.steps[j];
    const p = a.p.clone().lerp(b.p,t), q = a.q.clone().slerp(b.q,t), s = a.s.clone().lerp(b.s,t);
    const box = geometryBox(part.geom).clone().applyMatrix4(matrix.compose(p,q,s));
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    const dumbbell = model.name.includes("dumbbell") && n > 1 && size.length() < .45;
    const role = size.z > 1.28 && size.z < 2.8 && Math.max(size.x,size.y) < .7 && Math.min(size.x,size.y) > .038 ? "tower"
      : size.z > .014 && size.z < .09 && size.x > .21 && size.x < .55 && size.y > .10 && size.y < .35 && center.z > .12 ? "stack"
      : null;
    const prop = dumbbell || n > 1 && /^(flat_bench_press|(?:conventional|sumo|trap_bar|stiff_leg)_deadlift)$/.test(model.name);
    const overheadGrip = model.name.startsWith("lat_pulldown") && n > 1
      && box.min.z > 1.30 && box.max.z < 1.98 && box.min.y < -.23;
    const key = part.source ? partBase(part.source) + ":" + part.geom.attributes.position.count : part.geom.uuid;
    return {part,p,q,s,box,size,center,key,role,prop,dumbbell,overheadGrip};
  });
}

function commonEquipment(a,b) {
  if (a.dumbbell !== b.dumbbell) return Infinity;
  const distance = a.center.distanceTo(b.center);
  if (a.key === b.key && a.part.mat === b.part.mat && a.part.texture === b.part.texture && distance < (a.dumbbell ? .85 : 1.05)) {
    if (a.dumbbell && Math.sign(a.center.x) !== Math.sign(b.center.x)) return Infinity;
    if (!a.part.source || !b.part.source || a.part.source.verts.every((v,i) => Math.abs(v-b.part.source.verts[i]) < 1e-5)) return distance;
  }
  if (!a.role || a.role !== b.role || distance > 1.2) return Infinity;
  const size = Math.min(a.size.length(),b.size.length());
  return (a.size.distanceTo(b.size) < size*.46 ? 2+distance + a.size.distanceTo(b.size)*3 : Infinity);
}

function wristRelative(row, hand) {
  const inv = hand.q.clone().invert();
  return {p:row.p.clone().sub(hand.p).applyQuaternion(inv), q:inv.multiply(row.q)};
}

function equipmentTimeline(from,to,route,phaseA,phaseB) {
  const a = transitionEquipment(from,phaseA), b = transitionEquipment(to,phaseB);
  const left = new Set(a), right = new Set(b), pairs = [], group = new THREE.Group();
  const make = row => {
    const {part,p,q,s} = row;
    const material = makePresetMaterial(part.mat,part.color,part.smooth,part.texture);
    const mesh = new THREE.Mesh(part.geom,material);
    mesh.position.copy(p); mesh.quaternion.copy(q); mesh.scale.copy(s);
    if (isTransparentPreset(part.mat)) mesh.renderOrder = 2;
    group.add(mesh);
    return {row,mesh,opacity:material.opacity,transparent:material.transparent,depthWrite:material.depthWrite};
  };
  const lifts = model => [model.loadRig?.group,model.loadRig?.stands].filter(g => g?.visible).map(g => ({
    group:g, z:g.position.z, materials:g.children.filter(o => o.isMesh).map(o => [o.material,o.material.opacity,o.material.transparent,o.material.depthWrite])
  }));
  const loadingA = lifts(from), loadingB = lifts(to);
  const start = route.poses[0], end = route.poses.at(-1), hands = route.rig.hands;
  const nearestWrist = (row,pose) => row.center.distanceToSquared(pose.nodes[hands[0]].p) < row.center.distanceToSquared(pose.nodes[hands[1]].p) ? hands[0] : hands[1];
  const candidates = [];
  for (const x of a) for (const y of b) {
    const score = commonEquipment(x,y);
    if (Number.isFinite(score)) candidates.push({x,y,score});
  }
  candidates.sort((a,b) => a.score-b.score);
  for (const {x,y,score} of candidates) {
    if (!left.has(x) || !right.has(y)) continue;
    const hand = x.dumbbell ? nearestWrist(x,start) : null;
    if (hand !== null && hand !== nearestWrist(y,end)) continue;
    left.delete(x); right.delete(y);
    pairs.push({a:make(x), b:score >= 2 ? make(y) : null, target:y, hand,
      colorA:new THREE.Color(...x.part.color), colorB:new THREE.Color(...y.part.color),
      localA:hand !== null ? wristRelative(x,start.nodes[hand]) : null,
      localB:hand !== null ? wristRelative(y,end.nodes[hand]) : null});
  }
  const side = (rows,pose) => [...rows].map(row => {
    const hand = row.dumbbell ? nearestWrist(row,pose) : null;
    return {...make(row), hand, local:hand === null ? null : wristRelative(row,pose.nodes[hand])};
  });
  const outgoing = side(left,start), incoming = side(right,end);
  const mountedA = route.a === "reclined" || route.a === "low";
  const mountedB = route.b === "reclined" || route.b === "low";
  from.equipment.group.visible = to.equipment.group.visible = false;
  world.add(group);

  const shift = new THREE.Vector3(), pivot = new THREE.Vector3(), scale = new THREE.Vector3();
  const opacity = (m,alpha,base,transparent,depthWrite) => {
    const translucent = alpha < 1 || transparent;
    if (m.transparent !== translucent) m.needsUpdate = true;
    m.opacity = base*alpha; m.transparent = translucent; m.depthWrite = alpha === 1 && depthWrite;
  };
  const fade = (item,alpha) => {
    item.mesh.visible = alpha > .001;
    opacity(item.mesh.material,alpha,item.opacity,item.transparent,item.depthWrite);
  };
  const wrist = (mesh,hand,localP,localQ) => {
    const node = route.world[hand];
    mesh.position.copy(localP).applyQuaternion(node.q).add(node.p);
    mesh.quaternion.copy(node.q).multiply(localQ);
  };
  const shiftGroup = (groups,alpha,z) => {
    for (const item of groups) {
      item.group.visible = alpha > .001;
      item.group.position.z = item.z+z;
      for (const [m,base,transparent,depthWrite] of item.materials) opacity(m,alpha,base,transparent,depthWrite);
    }
  };
  const benchBarLift = .22;
  const barA = route.a === "reclined", barB = route.b === "reclined";
  const frontA = new THREE.Vector3(0,-1,0).applyAxisAngle(UP,poseHeading(start));
  const parkedBar = pairs.some(p => p.a.row.prop && p.target.prop && p.hand === null) && (barA || barB);
  // Move a reused bench bar clear of the character before lifting and
  // transferring it. Only lower it into its final grip after the back is down.
  const barStep = t => {
    const park = smooth(ramp(t,.10,.34)), transfer = smooth(ramp(t,.83,.94));
    const raise = smooth(ramp(t,.34,.72)), lower = smooth(ramp(t,.91,.985));
    return {k:transfer, y:.70*park*(1-transfer), z:.50*raise*(1-transfer)+.29*transfer*(1-lower)};
  };
  return {
    count:pairs.length,
    boxes:[...a,...b].map(row => row.box).filter(box => box.max.z-box.min.z > .12),
    draw(t) {
      const offA = route.walkOut ? .62 : mountedA ? (barA ? .43 : .37) : .12;
      const showB = mountedB ? (mountedA ? .60 : .43) : (route.b === "floor" ? .60 : .79);
      const swap = smooth(ramp(t,offA,Math.max(offA+.10,showB)));
      const bar = parkedBar ? barStep(t) : null;
      const liftA = .26*smooth(ramp(t,.10,.26));
      const liftB = .26*(1-smooth(ramp(t,.64,.82)));
      for (const item of outgoing) {
        const {row,mesh,hand,local} = item;
        const off = row.dumbbell ? .055 : row.prop ? .10 : offA;
        const f = smooth(ramp(t,off,off+(row.dumbbell ? .16 : row.prop && barA ? .07 : .14)));
        fade(item,1-f);
        if (hand !== null) wrist(mesh,hand,local.p,local.q);
        else if (row.prop && bar) mesh.position.copy(row.p).addScaledVector(frontA,bar.y).setZ(row.p.z+bar.z);
        else if (row.prop && barA) mesh.position.copy(row.p).addScaledVector(frontA,.44*f);
        else mesh.position.z = row.p.z-.14*f;
        if (row.overheadGrip) mesh.position.z += liftA;
      }
      for (const item of incoming) {
        const {row,mesh,hand,local} = item;
        const benchBar = row.prop && route.b === "reclined";
        const on = benchBar ? (bar ? .74 : .70) : row.dumbbell ? .77 : showB-.16;
        const f = smooth(ramp(t,on,on+.18));
        fade(item,f);
        if (hand !== null) wrist(mesh,hand,local.p,local.q);
        else if (benchBar && bar) {
          // New collars/plates ride the returning shaft while materializing.
          const reference = pairs.find(p => p.a.row.prop && p.target.prop);
          const deltaZA = reference.a.row.p.z-reference.target.p.z;
          const deltaYA = reference.a.row.p.y-reference.target.p.y;
          mesh.position.copy(row.p).addScaledVector(frontA,bar.y);
          mesh.position.y += deltaYA*(1-bar.k);
          mesh.position.z += deltaZA*(1-bar.k)+bar.z;
        } else mesh.position.z = row.p.z + (benchBar ? benchBarLift*(1-smooth(ramp(t,.88,.985))) : -.14*(1-f));
        if (row.overheadGrip) mesh.position.z += liftB;
      }
      for (const pair of pairs) {
        const {a,b,target,hand,localA,localB} = pair, mesh = a.mesh;
        const ridesBar = bar && a.row.prop && target.prop && hand === null;
        const k = ridesBar ? bar.k : hand === null ? swap : t;
        if (hand !== null) {
          shift.lerpVectors(localA.p,localB.p,k);
          wrist(mesh,hand,shift,tq.slerpQuaternions(localA.q,localB.q,k));
        } else if (b) {
          pivot.lerpVectors(a.row.center,target.center,k);
          scale.lerpVectors(a.row.size,target.size,k);
          for (const item of [a,b]) {
            const {row,mesh} = item;
            const height = scale.z / row.size.z;
            mesh.scale.copy(row.s);
            mesh.position.copy(row.p).add(pivot).sub(row.center);
            mesh.position.z += (height-1)*(row.p.z-row.center.z);
            mesh.scale.z *= height;
          }
          fade(a,1-k); fade(b,k);
        } else {
          mesh.position.lerpVectors(a.row.p,target.p,k);
          if (ridesBar) { mesh.position.addScaledVector(frontA,bar.y); mesh.position.z += bar.z; }
          mesh.position.z += mix(a.row.overheadGrip ? liftA : 0,target.overheadGrip ? liftB : 0,k);
          mesh.quaternion.slerpQuaternions(a.row.q,target.q,k);
        }
        if (!b) {
          mesh.scale.lerpVectors(a.row.s,target.s,k);
          mesh.material.color.lerpColors(pair.colorA,pair.colorB,k);
        }
      }
      const oldLoad = 1-smooth(ramp(t,offA,offA+.14)), newLoad = smooth(ramp(t,showB-.18,showB));
      shiftGroup(loadingA,oldLoad,-.14*(1-oldLoad)); shiftGroup(loadingB,newLoad,-.14*(1-newLoad));
    },
    finish() {
      if (!group.parent) return;
      world.remove(group);
      group.traverse(o => { if (o.isMesh) o.material.dispose(); });
      shiftGroup(loadingB,1,0);
      to.equipment.group.visible = true;
    }
  };
}

function viewOrbit(view) {
  const {x,y,z} = view.offset;
  return {target:view.target, azimuth:Math.atan2(y,x), elevation:Math.atan2(z,Math.hypot(x,y)), radius:view.offset.length()};
}

function orbitDirection(a,b,k,out) {
  const yaw = a.azimuth + shortestAngle(a.azimuth,b.azimuth)*k, pitch = mix(a.elevation,b.elevation,k);
  return out.set(Math.cos(yaw)*Math.cos(pitch),Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch));
}

function orbitClearance(a,b,boxes) {
  const ray = new THREE.Ray(), hit = new THREE.Vector3(), eye = new THREE.Vector3();
  const margin = .12;
  let retreat = 0;
  for (let i = 1; i < 20; i++) {
    const k = i/20, radius = mix(a.radius,b.radius,k);
    ray.origin.lerpVectors(a.target,b.target,k);
    orbitDirection(a,b,k,ray.direction);
    ray.at(radius,eye);
    for (const box of boxes) if (box.distanceToPoint(eye) < margin && ray.intersectBox(box,hit)) {
      const reverse = new THREE.Ray(eye.clone().addScaledVector(ray.direction,5),ray.direction.clone().negate());
      if (reverse.intersectBox(box,hit)) retreat = Math.max(retreat,hit.distanceTo(ray.origin)+margin-radius);
    }
  }
  return retreat;
}

function morphCamera(state, t, points) {
  const {fromView:a, toView:b, target, offset, right, up, sample, retreat, close} = state;
  const k = smooth(close ? ramp(t,.13,1) : t);
  const pullBack = smooth(ramp(t,0,.17))*smooth(ramp(1-t,0,.33));
  const radius = mix(a.radius,b.radius,k)+retreat*pullBack;
  target.lerpVectors(a.target,b.target,k);
  orbitDirection(a,b,k,offset);
  right.crossVectors(UP,offset).normalize();
  up.crossVectors(offset,right);
  const frustum = .92*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
  let needed = radius;
  for (let i = 0; i < points.length; i += 3) {
    sample.fromArray(points,i).sub(target);
    const fit = Math.max(Math.abs(sample.dot(up)),Math.abs(sample.dot(right))/camera.aspect)/frustum;
    needed = Math.max(needed,sample.dot(offset)+fit);
  }
  const reframe = smooth(ramp(t,0,.18))*smooth(ramp(1-t,0,.16));
  offset.multiplyScalar(mix(radius,needed,reframe));
  setView(state);
}

function restingModel(model, a) {
  pose(model,a); poseHuman(model,a);
}

function requestExercise(id) {
  const name = exerciseModels?.[id]?.[0];
  if (!window.__ready || !shown[0]?.human || !humanList.has(name) || exerciseModels[id].length !== 1) {
    return Promise.resolve(false);
  }
  if (pendingExercise?.id === id) return pendingExercise.promise;
  if (pendingExercise) {
    pendingExercise.resolve(false);
    if (pendingExercise.model) disposeModel(pendingExercise.model);
    pendingExercise = null;
  }
  if (id === transition?.id) return transition.promise;
  if (!transition && id === activeExercise) {
    if (!anim) playRep();
    return Promise.resolve(false);
  }
  const request = {id};
  request.promise = new Promise(resolve => { request.resolve = resolve; });
  pendingExercise = request;
  prepareModels(exerciseModels[id]).then(models => {
    const model = models[0];
    if (!model?.human) {
      models.forEach(disposeModel);
      throw Error("Transition target has no character");
    }
    if (pendingExercise !== request) { disposeModel(model); return; }
    request.model = model;
    request.view = exerciseView(id, models, model.human.acts[0]);
    request.loadRevision = loadRevision;
  }).catch(error => {
    if (pendingExercise !== request) return;
    console.warn("Couldn't prepare exercise transition", error);
    pendingExercise = null;
    if (request.model) disposeModel(request.model);
    request.resolve(false);
    if (!anim && !transition) playRep();
  });
  return request.promise;
}

function beginExerciseMorph(now) {
  const request = pendingExercise;
  if (!request?.model) return;
  const from = shown[0], to = request.model;
  pendingExercise = null;
  if (request.loadRevision !== loadRevision) {
    applyEquipmentLoad(to,loadKg);
    request.view = exerciseView(request.id,[to],to.human.acts[0]);
    request.loadRevision = loadRevision;
  }
  const rig = morphRig(from.human.base);
  const startA = clipMorphPose(rig,from,act);
  const first = to.human.acts[0], startB = clipMorphPose(rig,to,first);
  const entry = to.repMeta?.playback_range?.[0] ?? 0;
  // Some exercises intentionally omit their setup in the ordinary repeat loop.
  // Land on their stored frame zero, then bridge to the unchanged loop entry.
  const bridge = entry > first ? 160 : 0;
  const hasA = from.equipment.parts.length > 0;
  const keepDumbbells = from.name.includes("dumbbell") && to.name.includes("dumbbell");
  const route = makeMorphRoute(rig,startA,startB,from.name,hasA,keepDumbbells);
  const equipment = equipmentTimeline(from,to,route,act,first);
  const resumeControls = controls.enabled;
  const damping = controls.enableDamping;
  const fromView = viewOrbit({target:controls.target.clone(),offset:camera.position.clone().sub(controls.target)});
  const toView = viewOrbit(request.view), normalRadius = defaultView.offset.length();
  const close = fromView.radius < normalRadius*.79;
  const retreat = Math.max(close ? normalRadius*.90-fromView.radius : 0, orbitClearance(fromView,toView,equipment.boxes));
  controls.enabled = false;
  controls.enableDamping = false;
  controls.update(); // Clear remaining orbit inertia before the authored camera flight.
  to.humanMesh.visible = false;
  if (to.watch) to.watch.group.visible = false;
  world.add(to.group);
  transition = { ...request, from, to, equipment, entry, first, bridge, t0:now,
    route, resumeControls, damping, fromView, toView, close, retreat,
    target:new THREE.Vector3(), offset:new THREE.Vector3(),
    right:new THREE.Vector3(), up:new THREE.Vector3(), sample:new THREE.Vector3() };
  advanceExerciseMorph(now);
}

function advanceExerciseMorph(now) {
  const s = transition;
  const elapsed = now - s.t0;
  const t = unit(elapsed / (MORPH_MS-s.bridge));
  if (elapsed >= MORPH_MS) {
    s.equipment.finish();
    s.to.humanMesh.visible = humanOn;
    if (s.to.watch) s.to.watch.group.visible = humanOn;
    showModels(s.id,[s.to]);
    defaultView = s.view;
    setView(defaultView);
    controls.enableDamping = s.damping;
    controls.enabled = s.resumeControls;
    transition = null;
    disposeModel(s.from);
    if (s.loadRevision !== loadRevision) applyEquipmentLoad(s.to,loadKg);
    playRep(now);
    s.resolve(true);
    return;
  }
  const attribute = s.from.human.geom.attributes.position;
  if (t < 1 || !s.bridge) drawMorph(s.route,t,attribute);
  else {
    const a = mix(s.first,s.entry,smooth(unit((elapsed-MORPH_MS+s.bridge)/s.bridge)));
    if (s.to.equipment.group.visible === false) s.equipment.finish();
    restingModel(s.to,a);
    attribute.array.set(s.to.human.geom.attributes.position.array);
    attribute.needsUpdate = true;
  }
  if (s.from.watch) placeWatch(s.from.watch,attribute.array);
  if (t < 1 || !s.bridge) s.equipment.draw(t);
  morphCamera(s,t,attribute.array);
}

function advanceViewer(now) {
  if (transition) { advanceExerciseMorph(now); return; }
  for (const m of shown) {
    if (!m.loadRig?.moving) continue;
    advanceLoad(m.loadRig, now);
    if (!anim) m.loadRig.pose(act);
  }
  if (anim) {
    const t = Math.max(0,(now - anim.t0) / repMs());
    const [start,end] = repRange();
    if (t >= 1) {
      setAct(start);
      if (!looping || pendingExercise) anim = null;
      else anim.t0 = now;
    } else setAct(start+(end-start)*(repMeta()?.playback_mode==="cycle" ? t : (t<.5 ? ease(t*2) : ease((1-t)*2))));
  }
  if (shown.length === 1 && ALT_MIRROR.has(shown[0].name)) shown[0].group.scale.x = anim && (now - anim.t0) / repMs() >= .5 ? -1 : 1;
  if (!anim && pendingExercise) beginExerciseMorph(now);
}

window.transitionTo = requestExercise;
renderer.setAnimationLoop(now => {
  advanceViewer(now);
  controls.update(); renderer.render(scene, camera);
});

async function start() {
  const cameraReady = fetch("camera_views.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : {})
    .then(views => { camViews = views; })
    .catch(() => {});
  const [map] = await Promise.all([
    fetch("exercise_models.json").then(r => r.json()),
    loadHumanList(),
    loadWgmManifest()
  ]);
  exerciseModels = map;
  const [models] = await Promise.all([prepareModels(map[EX] || []), cameraReady]);
  showModels(EX,models);
  defaultView = exerciseView(EX,models,act);
  setView(params.has("yaw") || params.has("elev") || params.has("zoom") || params.has("lockYaw") || params.has("focus")
    ? exerciseView(EX,models,act,true) : defaultView);
  resize();
  if (!params.has("next") || SNAP) playRep();
  renderer.render(scene, camera);
  window.__ready = true;
  if (params.has("next") && !SNAP) {
    requestExercise(params.get("next")).then(ok => { if (!ok && !anim && !transition && !pendingExercise) playRep(); });
  }
  if (SNAP) {   // still frames for review sheets and thumbnail capture; __snap(a) draws the rep at progress a
    window.__snap = (a, type = "image/png") => { anim = null; looping = false; setAct(a); controls.update(); renderer.render(scene, camera); return renderer.domElement.toDataURL(type, 0.9); };
    parent.postMessage({ id: EX, png: window.__snap(+SNAP, "image/jpeg") }, "*");
  }
}
if (EX) start().catch(error => {
  console.error(error);
  const empty = document.getElementById("empty"); empty.textContent = "운동 동작을 불러오지 못했어요";
  empty.style.display = "flex";
});
</script>
