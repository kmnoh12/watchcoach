<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워치짐 기구 뷰어</title>
<script>if (new URLSearchParams(location.search).get("ex")) document.documentElement.classList.add("embed");</script>
<style>
  :root { --bg:#0e0f0f; --panel:#161818; --line:#262a29; --text:#ece8e1; --dim:#8d8a84; --sage:#76DBB9; --warn:#e8b45a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
  #app { display:grid; grid-template-columns:300px 1fr; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .top { padding:14px 14px 8px; }
  h1 { font-size:15px; margin:0 0 10px; font-weight:650; letter-spacing:-.01em; }
  input[type=search] { width:100%; padding:9px 11px; background:#0e0f0f; border:1px solid var(--line); color:var(--text); border-radius:8px; font-size:14px; outline:none; }
  input[type=search]:focus { border-color:var(--sage); }
  .tabs { display:flex; gap:6px; margin-top:10px; }

  .tabs button.on, .cats button.on { color:#0e0f0f; background:var(--sage); border-color:var(--sage); }
  .cats { display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; }
  #list { overflow:auto; flex:1; padding:0 6px 14px; }
  .item { padding:8px 10px; border-radius:7px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }

  .item.on { background:#20302b; }
  .item .sub { color:var(--dim); font-size:12px; white-space:nowrap; }
  .item.none { color:var(--dim); }
  .item.none .sub { color:var(--warn); }
  main { position:relative; min-width:0; }
  canvas { display:block; }
  #hud { position:absolute; left:16px; top:14px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }

  #bar button { background:#20302b; color:var(--sage); border:1px solid #2f4a41; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }

  #bar button.ghost.on { color:var(--sage); border-color:#2f4a41; }

  .views { display:flex; gap:4px; }

  #toast { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:#20302b; color:var(--sage); padding:6px 12px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; grid-template-rows:42% 58%; } aside { border-right:none; border-bottom:1px solid var(--line); } }
  .item > span:first-child { min-width:0; }

  html.embed aside, html.embed #hud, html.embed #bar, html.embed #toast, html.embed #empty { display:none !important; }

<body>
<div id="app">
  <aside>
    <div class="top">
      <h1>워치짐 기구 뷰어</h1>
      <input id="q" type="search" placeholder="운동이나 기구 검색 (예: 로우, 레그 컬)">

    <div class="cats" id="cats"></div>
    <div id="list"></div>
  </aside>
  <main id="stage">
    <div id="hud"><div><div id="title"></div><div id="models"></div><div id="opts"></div></div><div id="status"></div></div>
    <div id="empty">왼쪽에서 운동이나 기구를 골라줘</div>
    <div id="toast"></div>
    <div id="bar">

      <button id="loop" class="ghost">반복 재생</button>
      <button id="humanBtn" class="ghost" hidden>사람 보기</button>

      <div class="views">
        <button class="ghost" data-view="q">비스듬히</button><button class="ghost" data-view="side">옆</button><button class="ghost" data-view="front">앞</button><button class="ghost" data-view="top">위</button>
      </div>
    </div>
  </main>
</div>
<script type="module">

  seated_calf:"시티드 카프", seated_leg_curl:"시티드 레그 컬", seated_row_machine:"머신 시티드 로우(핀)", shoulder_press_machine:"숄더 프레스 머신", shrug_machine:"슈러그 머신",
  smith:"스미스", smith_machine:"스미스 머신", standing_calf:"스탠딩 카프", standing_leg_curl:"스탠딩 레그 컬", tbar_row_machine:"티바 로우 머신", trap_bar:"트랩바", viking_press:"바이킹 프레스", weight_plate:"원판",

const HEIGHT_L = { low: "바닥", knee: "무릎~허벅지", mid: "중간", high: "높게" };
const GRIP_L = { d: "D 핸들", straight: "일자바", ez: "이지바", rope: "로프", v_bar: "V바", neutral: "뉴트럴 그립", mag: "맥 그립", triangle: "삼각 핸들", ankle: "발목 스트랩", lat: "랫 바" };
const MODE_L = { fly: "펙덱 플라이", reverse: "리버스 플라이" };
const DEFAULT_PULL = { low: "up", knee: "up", mid: "forward", high: "down" };
const DEFAULT_FLY = { low: "fly_low", knee: "fly_low", mid: "fly_mid", high: "fly_high" };
function parseKey(k) { const [base, ...o] = k.split("~"); const c = { base }; for (const x of o) { const [a, b] = x.split("="); c[a] = b; } return c; }

  return [KNAME[c.base] || c.base, c.m && MODE_L[c.m], c.h && HEIGHT_L[c.h], c.g && GRIP_L[c.g]].filter(Boolean).join(" · ");
}
const baseOf = n => n.split("~")[0];
const optModels = { cable_tower: { h: ["low", "knee", "mid", "high"], g: ["d", "straight", "ez", "rope", "v_bar", "triangle", "ankle"] },
                    cable_crossover: { h: ["low", "mid", "high"], g: [] }, lat_pulldown: { h: [], g: ["lat", "mag", "d", "straight", "rope", "neutral"] }, pec_deck: { m: ["fly", "reverse"], h: [], g: [] } };
const defaultModel = m => m === "cable_tower" ? "cable_tower~h=mid~g=d~p=forward" : m === "cable_crossover" ? "cable_crossover~h=mid~g=d~p=fly_mid" : m === "lat_pulldown" ? "lat_pulldown~g=lat" : m === "pec_deck" ? "pec_deck~m=fly" : m;

// ---------- scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const EMBED = new URLSearchParams(location.search).get("ex");
scene.background = new THREE.Color(EMBED ? 0x34322e : 0x1b1d1d);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2, -3, 5); scene.add(sun);
const grid = new THREE.GridHelper(12, 24, 0x3a403e, 0x2a2e2d); grid.rotation.x = Math.PI / 2; if (!EMBED) scene.add(grid);
const world = new THREE.Group(); scene.add(world);

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------- models ----------
const cache = {};      // name -> parsed data
let shown = [];        // [{name, group, objs:[{mesh, steps:[{p,q,s}]}], n}]
let current = null;    // {kind, id, models}
let act = 0;
// ---------- seated avatar (poses measured by the human fit tests; three samples blended along act) ----------
let humanList = new Set(), humanOn = true;
try { humanOn = localStorage.getItem("humanOn") !== "0"; } catch (e) {}
const humanCache = {};
const BONE_NAMES = ["pelvis", "spine_03", "neck_01"];   // bones the first view reads (see the q-view block below)
let v5Manifest, humanBasePromise;
async function loadHumanList() {
  const r = await fetch("human_v5/manifest.json");
  if (!r.ok) throw Error("V5 manifest missing");
  v5Manifest = await r.json();
  humanList = new Set(v5Manifest.clips.map(c => c.id));
}
function fetchHumanBase() {
  if (!humanBasePromise) humanBasePromise = (async () => {
    const r = await fetch("human_v5/base.json");
    if (!r.ok) throw Error("V5 base missing");
    const b = await r.json();
    return { points: new Float32Array(b.rest), tris: new Uint16Array(b.triangles), names: b.bone_names,
      joints: b.joints.flat(), weights: b.weights.flat() };
  })();
  return humanBasePromise;
}
function humanFrame(h, frame) {
  if (h.skinFrames.has(frame)) return h.skinFrames.get(frame);
  const out = new Float32Array(h.vertices * 3), start = frame * out.length;
  for (let i = 0; i < out.length; i++) out[i] = h.minimum[i % 3] + h.quantized[start + i] * h.scale[i % 3];
  h.skinFrames.set(frame, out);
  if (h.skinFrames.size > 3) h.skinFrames.delete(h.skinFrames.keys().next().value);
  return out;
}
async function fetchHuman(machine) {
  if (humanCache[machine]) return humanCache[machine];
  if (!humanList.has(machine)) throw Error("V5 motion missing: " + machine);
  const [r, base] = await Promise.all([fetch(`human_v5/${encodeURIComponent(machine)}.bin`), fetchHumanBase()]);
  if (!r.ok) throw Error("V5 motion unavailable");
  const a = await r.arrayBuffer(), d = new DataView(a);
  if (a.byteLength < 40 || d.getUint32(0, true) !== 0x32504757) throw Error("invalid V5 cache");
  const n = d.getUint32(4, true), vertices = d.getUint32(8, true);
  if (!n || vertices * 3 !== base.points.length || a.byteLength !== 40 + n * 4 + n * vertices * 6) throw Error("invalid V5 size");
  const minimum = Array.from({length:3}, (_,i) => d.getFloat32(16+i*4,true));
  const scale = Array.from({length:3}, (_,i) => d.getFloat32(28+i*4,true));

  for (let i=0;i<n;i++) acts[i] = d.getFloat32(40+i*4,true);
  if (minimum.some(x=>!Number.isFinite(x)) || scale.some(x=>!Number.isFinite(x)||x<=0) ||

  for (let i=0;i<quantized.length;i++) quantized[i] = d.getUint16(40+n*4+i*2,true) + (i >= stride ? quantized[i-stride] : 0);
  const h = { acts, base, vertices, minimum, scale, quantized, skinFrames:new Map(), format:"v5-point-cache" };
  const g = new THREE.BufferGeometry(), pos = new THREE.BufferAttribute(humanFrame(h,0).slice(),3);
  pos.setUsage(THREE.DynamicDrawUsage); g.setAttribute("position",pos); g.setIndex(new THREE.BufferAttribute(base.tris,1)); h.geom=g;

}
function poseHuman(m, a) {
  const h = m.human; if (!h) return;
  const n = h.acts.length;
  let i = 0; while (i < n - 2 && a > h.acts[i + 1]) i++;
  const t = n > 1 ? Math.min(1,Math.max(0,(a-h.acts[i])/(h.acts[i+1]-h.acts[i]))) : 0;
  const A = humanFrame(h, i), B = humanFrame(h, Math.min(i + 1, n - 1)), P = h.geom.attributes.position.array;
  for (let k = 0; k < P.length; k++) P[k] = A[k] + (B[k] - A[k]) * t;

}

function parse(d) {
  const objs = d.objects.map(o => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(o.verts, 3));
    g.setIndex(o.tris);
    const ng = g.toNonIndexed(); ng.computeVertexNormals();
    const steps = o.m.map(a => { const m = new THREE.Matrix4().fromArray(a); const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); m.decompose(p, q, s); return { p, q, s }; });
    return { geom: ng, color: o.color, steps };
  });

}

async function fetchModel(name) {
  const r = await fetch(`data/${name}.json?v=${manifest[name] || Date.now()}`);
  if (!r.ok) return null;
  return parse(await r.json());
}

function buildGroup(name, d) {
  const group = new THREE.Group();
  const objs = d.parsed.map(o => {
    const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(...o.color), flatShading: true });
    const mesh = new THREE.Mesh(o.geom, mat); mesh.matrixAutoUpdate = false; group.add(mesh);
    return { mesh, steps: o.steps };

const tp = new THREE.Vector3(), tq = new THREE.Quaternion(), ts = new THREE.Vector3();
function pose(m, a) {
  for (const o of m.objs) {
    const n = o.steps.length;
    if (n === 1) { o.mesh.matrix.compose(o.steps[0].p, o.steps[0].q, o.steps[0].s); continue; }
    const x = a * (n - 1), i = Math.min(Math.floor(x), n - 2), t = x - i, A = o.steps[i], B = o.steps[i + 1];
    tp.lerpVectors(A.p, B.p, t); tq.slerpQuaternions(A.q, B.q, t); ts.lerpVectors(A.s, B.s, t);

function setAct(a) { act = a; for (const m of shown) { pose(m, a); poseHuman(m, a); } actEl.value = a; actv.textContent = Math.round(a * 100) + "%"; }

function bounds() {
  const box = new THREE.Box3(), keep = act;
  for (const a of EMBED ? [0, .25, .5, .75, 1] : [keep]) {   // embedded view: frame the whole rep, not only the start pose
    if (EMBED) for (const m of shown) { pose(m, a); poseHuman(m, a); if (m.human) m.human.geom.computeBoundingBox(); }   // bounds are cached per geometry: refresh for every sampled pose
    world.updateMatrixWorld(true);
    for (const m of shown) box.expandByObject(m.group);
  }

  return box;

// ---------- first view: read the frame-zero mesh, never alter the human pose ----------
const FRONT_DEG = 40, ELEV_DEG = 25, LYING_Z = 0.45;
const viewFrames = new WeakMap();
function facingOf(h) {

  const centre = name => {
    const bone = b.names.indexOf(name); if (bone < 0) return null;
    const c = new THREE.Vector3(); let total = 0;
    for (let v = 0; v < P.length / 3; v++) for (let j = 0; j < 4; j++) {

    return total > 1e-6 ? c.divideScalar(total) : null;
  };
  const left = centre("clavicle_l"), right = centre("clavicle_r"),
        neck = centre("neck_01"), pelvis = centre("pelvis");
  if (!left || !right || !neck || !pelvis) return null;
  const up = neck.sub(pelvis), across = left.sub(right);
  if (up.lengthSq() < 1e-6 || across.lengthSq() < 1e-6) return null;
  // Bind mesh: anatomical left is +X, head is +Z, nose/chest is -Y.
  // left cross up is therefore the chest front. Frame-zero vertices already carry
  // every fitted model's yaw, including the 180-degree cable/pulldown variants.
  const front = new THREE.Vector3().crossVectors(across, up).normalize();
  if (front.lengthSq() < 1e-6) return null;
  const lying = Math.abs(up.clone().normalize().z) < LYING_Z;
  // For horizontal torsos use the headward axis: a side/head diagonal above the body.
  const heading = (lying ? up : front).clone().setZ(0);
  if (heading.lengthSq() < 1e-6) return null;
  const result = { front, heading: heading.normalize(), lying };
  viewFrames.set(h, result); return result;
}
function machineBehindPenalty(d, human) {
  const c = shown[0] && shown[0].machineCenter; if (!c || !human) return 0;
  const P = humanFrame(human.human, 0), centre = new THREE.Vector3();
  for (let v = 0; v < P.length; v += 3) centre.add(new THREE.Vector3(P[v], P[v + 1], P[v + 2]));
  centre.divideScalar(P.length / 3); human.mesh.localToWorld(centre);
  return d.x * (c.x - centre.x) + d.y * (c.y - centre.y);
}
function qViewDir(human) {
  const facing = human && facingOf(human.human); if (!facing) return null;
  const sideDir = sign => {
    // Lying: 40 degrees from the body's side, toward its head; upright: 40 from front.
    const angle = sign * (facing.lying ? 90 - FRONT_DEG : FRONT_DEG) * Math.PI / 180;
    const f = facing.heading, c = Math.cos(angle), s = Math.sin(angle);
    const d = new THREE.Vector3(f.x * c - f.y * s, f.x * s + f.y * c, 0);
    let elevation = ELEV_DEG * Math.PI / 180;
    // A bent standing torso (deadlift) can put 25 degrees just behind the chest.
    // Lower slightly to stay in front; prone/lying bodies retain the above-body view.
    if (!facing.lying && facing.front.z < 0) {
      const limit = Math.atan2(d.dot(facing.front), -facing.front.z) - 2 * Math.PI / 180;
      elevation = Math.min(elevation, Math.max(0, limit));
    }
    return d.setZ(Math.tan(elevation)).normalize();
  };
  const a = sideDir(1), b = sideDir(-1);
  return machineBehindPenalty(b, human) < machineBehindPenalty(a, human) ? b : a;
}

const humanBtn = document.getElementById("humanBtn");
humanBtn.onclick = () => { humanOn = !humanOn; try { localStorage.setItem("humanOn", humanOn ? "1" : "0"); } catch (e) {} for (const m of shown) if (m.humanMesh) m.humanMesh.visible = humanOn; humanBtn.classList.toggle("on", humanOn); humanBtn.textContent = humanOn ? "사람 끄기" : "사람 보기"; };
async function show(models, keepCam = false) {
  const loaded = [];
  for (const n of models) { cache[n] = cache[n] || await fetchModel(n); if (cache[n]) loaded.push(n); }
  world.clear(); shown = [];
  let x = 0;
  loaded.forEach((n, i) => {
    const m = buildGroup(n, cache[n]); pose(m, 0);
    const b = new THREE.Box3().setFromObject(m.group);
    if (i > 0) x += 0.4 - b.min.x;     // accessories line up to the right of the main machine
    m.group.position.x = x; x += b.max.x;
    m.machineCenter = m.group.localToWorld(b.getCenter(new THREE.Vector3()));   // rest-pose centre in world space, for the first view
    world.add(m.group); shown.push(m);
  });
  humanBtn.hidden = true;
  const humanKey = shown.length === 1 ? (humanList.has(shown[0].name) ? shown[0].name : (shown[0].name.includes("~") ? null : baseOf(shown[0].name))) : null;
  if (humanKey && humanList.has(humanKey)) {
    const h = await fetchHuman(humanKey);
    if (h) {
      const mesh = new THREE.Mesh(h.geom, new THREE.MeshLambertMaterial({ color: 0x5aa9e6, flatShading: true }));
      mesh.frustumCulled = false; mesh.visible = humanOn; shown[0].human = h; shown[0].humanMesh = mesh; shown[0].group.add(mesh);
      humanBtn.hidden = false; humanBtn.classList.toggle("on", humanOn); humanBtn.textContent = humanOn ? "사람 끄기" : "사람 보기";
    }
  }
  setAct(act);
  document.getElementById("empty").style.display = shown.length ? "none" : "flex";
  if (!shown.length && models.length) document.getElementById("empty").textContent = "이 기구는 아직 3D 모델이 없어";
  modelsEl.textContent = loaded.map(kname).join(" + ") + (shown.length ? `  ·  ${shown.reduce((s, m) => s + m.faces, 0)}면` : "");
  if (!keepCam) setView("q");
}

function setView(v) {
  if (!shown.length) return;
  const b = bounds(), c = b.getCenter(new THREE.Vector3()), size = b.getSize(new THREE.Vector3()).length();
  const cableFront = shown.some(m => /^(cable_|functional_|lat_pulldown|high_pulley)/.test(m.name));   // handles are on the -Y side of cable stations
  const human = shown.length === 1 && shown[0].humanMesh ? { mesh: shown[0].humanMesh, human: shown[0].human } : null;   // the person decides the first view when there is a fit for this machine
  const dir = (v === "q" ? qViewDir(human) : null) || (v === "q" ? [0.9, cableFront ? -0.8 : 0.8, 0.45] : { side: [1, 0, 0.08], front: [0, -1, 0.12], top: [0.001, -0.15, 1] }[v]);
  camera.position.copy(c).add(new THREE.Vector3(...dir).normalize().multiplyScalar(size * (EMBED ? 1.25 : 1.7)));
  controls.target.copy(c); controls.update();
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));

// ---------- rep playback ----------
const actEl = document.getElementById("act"), actv = document.getElementById("actv");
let anim = null, looping = false;
const REP = 2600; // ms for one full rep: 0 -> 1 -> 0
function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
const ALT_MIRROR = new Set(["alternating_dumbbell_curl", "alternating_hammer_curl"]);   // one arm per rep: the way back is the mirrored (other) arm
function repMeta() { return v5Manifest?.clips.find(c=>c.id===shown[0]?.name); }
function repMs() { return repMeta()?.playback_ms || (shown.length===1 && ALT_MIRROR.has(shown[0].name) ? REP*2 : REP); }
function repRange() { return repMeta()?.playback_range || [0,1]; }   // alternating curls play at half speed
function playRep() { setAct(repRange()[0]); anim = { t0: performance.now() }; }
document.getElementById("play").onclick = playRep;
const loopBtn = document.getElementById("loop");
loopBtn.onclick = () => { looping = !looping; loopBtn.classList.toggle("on", looping); if (looping && !anim) playRep(); };
actEl.oninput = () => { anim = null; looping = false; loopBtn.classList.remove("on"); setAct(+actEl.value); };

renderer.setAnimationLoop(now => {
  if (anim) {
    const t = (now - anim.t0) / repMs();
    const [start,end] = repRange();
    if (t >= 1) { setAct(start); anim = looping ? { t0: now } : null; }
    else setAct(start+(end-start)*(repMeta()?.playback_mode==="cycle" ? t : (t<.5 ? ease(t*2) : ease((1-t)*2))));
  }
  if (shown.length === 1 && ALT_MIRROR.has(shown[0].name)) shown[0].group.scale.x = anim && (now - anim.t0) / repMs() >= .5 ? -1 : 1;
  controls.update(); renderer.render(scene, camera);
});

// ---------- list ----------
let exercises = [], catOrder = [], machines = [], tab = "ex", cat = "전체";
const listEl = document.getElementById("list"), catsEl = document.getElementById("cats"), q = document.getElementById("q");
const titleEl = document.getElementById("title"), modelsEl = document.getElementById("models");
const norm = s => s.toLowerCase().replace(/\s+/g, "");

function renderCats() {
  catsEl.innerHTML = "";
  if (tab !== "ex") return;
  const cats = ["전체", ...catOrder, ...[...new Set(exercises.map(e => e.cat))].filter(c => !catOrder.includes(c))];
  for (const c of cats) { const b = document.createElement("button"); b.textContent = c; b.className = c === cat ? "on" : ""; b.onclick = () => { cat = c; renderCats(); renderList(); }; catsEl.append(b); }
}
const openFam = new Set();   // families the user expanded ("분류/패밀리"); a search opens every family, like the app
function saveUi() { try { localStorage.setItem("wg-viewer-ui", JSON.stringify({ tab, cat, q: q.value, fams: [...openFam] })); } catch {} }
function renderList() {
  saveUi();
  const s = norm(q.value);
  listEl.innerHTML = "";
  const rows = [];
  if (tab === "ex") {
    const bodyRank = c => { const i = catOrder.indexOf(c); return i < 0 ? 99 : i; };
    const hits = exercises.map((e, i) => [e, i]).sort((a, b) => bodyRank(a[0].cat) - bodyRank(b[0].cat) || a[1] - b[1]).map(x => x[0]).filter(e => (cat === "전체" || e.cat === cat) && (!s || norm(e.name).includes(s) || e.id.includes(s) || (e.family && norm(e.family).includes(s)) || e.models.some(m => norm(kname(m)).includes(s) || norm(KNAME[baseOf(m)] || "").includes(s))));
    const asRow = (e, child) => ({ key: e.id, label: e.name, sub: e.models.length ? kname(e.models[0]) : "모델 없음", none: !e.models.length, child, open: () => pick("ex", e.id, e.name, e.models) });
    const emitted = new Set();
    for (const e of hits) {
      const members = e.family ? hits.filter(x => x.family === e.family && x.cat === e.cat) : [];
      if (members.length >= 2) {                         // same rule as the app: 2+ of one family in a body category fold into one row
        const fk = e.cat + "/" + e.family;
        if (emitted.has(fk)) continue;
        emitted.add(fk);
        const open = !!s || openFam.has(fk);
        rows.push({ key: "fam:" + fk, label: e.family, sub: members.length + "개", fam: true, expanded: open, open: () => { openFam.has(fk) ? openFam.delete(fk) : openFam.add(fk); renderList(); } });
        if (open) members.forEach((m, i) => rows.push({ ...asRow(m, true), lastChild: i === members.length - 1 }));
      } else rows.push(asRow(e, false));
    }
  } else {
    for (const m of machines.filter(m => !s || norm(kname(m)).includes(s) || m.includes(s)))
      rows.push({ key: m, label: kname(m), sub: exercises.filter(e => e.models.some(x => baseOf(x) === m)).length + "개 운동", open: () => pick("mc", m, kname(m), [defaultModel(m)]) });
  }
  for (const r of rows) {
    const d = document.createElement("div");
    d.className = "item" + (r.none ? " none" : "") + (r.child ? " child" : "") + (r.lastChild ? " last-child" : "") + (r.fam ? " fam" : "") + (r.expanded ? " expanded" : "") + (current && current.id === r.key ? " on" : "");
    d.innerHTML = `<span></span><span class="sub"></span>`; d.children[0].textContent = r.label; d.children[1].textContent = r.sub;
    d.setAttribute("role", "button"); d.tabIndex = 0;
    if (r.fam) {
      d.setAttribute("aria-expanded", String(r.expanded));
      const arrow = document.createElement("span"); arrow.className = "disclosure"; arrow.textContent = r.expanded ? "▾" : "▸"; arrow.setAttribute("aria-hidden", "true"); d.children[0].prepend(arrow);
    } else if (current && current.id === r.key) d.setAttribute("aria-current", "true");
    d.onkeydown = event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); r.open(); } };
    d.onclick = r.open; listEl.append(d);
  }
}
const optsEl = document.getElementById("opts");
function renderOpts() {
  optsEl.innerHTML = "";
  const key = current && current.models.find(m => m.includes("~"));
  if (!key) return;
  const c = parseKey(key), o = optModels[c.base]; if (!o) return;
  const row = (lab, vals, labels, cur, set) => {
    if (!vals.length) return; const r = document.createElement("div"); r.className = "row"; r.innerHTML = `<span class="lab">${lab}</span>`;
    for (const v of vals) { const b = document.createElement("button"); b.textContent = labels[v]; b.className = v === cur ? "on" : ""; b.onclick = () => set(v); r.append(b); }
    optsEl.append(r);
  };
  const apply = async n => {
    const nk = c.base === "pec_deck" ? `pec_deck~m=${n.m}` : c.base === "lat_pulldown" ? `lat_pulldown~g=${n.g}`
      : `${c.base}~h=${n.h}~g=${n.g}~p=${n.h === c.h ? c.p : (c.base === "cable_crossover" ? DEFAULT_FLY : DEFAULT_PULL)[n.h]}`;
    current.models = [nk]; await show(current.models, true); renderOpts();
  };
  if (o.m) row("모드", o.m, MODE_L, c.m, m => apply({ m }));
  row("높이", o.h, HEIGHT_L, c.h, h => apply({ h, g: c.g }));
  row("그립", o.g, GRIP_L, c.g, g => apply({ h: c.h, g }));
}
async function pick(kind, id, label, models) {
  current = { kind, id, models }; titleEl.textContent = label; act = 0; anim = null;
  renderList(); await show(models); renderOpts(); playRep();
  try { localStorage.setItem("wg-viewer-last", JSON.stringify({ kind, id, label, models })); } catch {}
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b)); renderCats(); renderList(); });
q.oninput = renderList;

// ---------- live link to Blender (Blender writes manifest/status; this page only polls static files) ----------
const statusEl = document.getElementById("status");
const toast = document.getElementById("toast");
function flash(t) { toast.textContent = t; toast.style.opacity = 1; clearTimeout(flash.h); flash.h = setTimeout(() => toast.style.opacity = 0, 1800); }
let manifest = {};
const getJSON = async p => (await fetch(`${p}?t=${Date.now()}`, { cache: "no-store" })).json();
async function poll() {
  try {
    const m = await getJSON("manifest.json");
    const changed = Object.keys(m).filter(n => manifest[n] && manifest[n] !== m[n]);
    const first = !Object.keys(manifest).length; manifest = m;
    if (first || machines.length !== Object.keys(m).filter(k => !k.includes("~")).length) { machines = Object.keys(m).filter(k => !k.includes("~")).sort(); if (tab === "mc") renderList(); }
    for (const n of changed) delete cache[n];
    const hit = changed.filter(n => current && current.models.includes(n));
    if (hit.length) { await show(current.models, true); flash(`${hit.map(kname).join(", ")} 블렌더 변경 반영됨`); }
  } catch {}
  try {
    const s = await getJSON("status.json");
    const live = Date.now() / 1000 - s.heartbeat < 6;
    const bl = !live ? `<span class="bad">블렌더 꺼짐 · 마지막 모델로 보는 중</span>` : s.scene ? `<span class="ok">블렌더 연결됨 · 실시간 반영</span>` : `<span class="bad">블렌더에 figure.blend가 안 열려 있음</span>`;
    const busy = live && s.busy ? ` · ${kname(s.busy)} 갱신 중` : live && s.pending.length ? ` · ${s.pending.length}개 대기` : "";
    const err = Object.keys(s.errors).length ? ` · <span class="bad">오류 ${Object.keys(s.errors).map(kname).join(", ")}</span>` : "";
    statusEl.innerHTML = bl + busy + err;
  } catch { statusEl.innerHTML = `<span class="bad">블렌더 상태 없음</span>`; }
}
if (!EMBED) setInterval(poll, 1500);

if (EMBED) (async () => {
  document.body.classList.add("embed");
  await loadHumanList();
  const map = await (await fetch("exercise_models.json")).json();
  humanOn = true; looping = true; resize();
  await show(map[EMBED] || []); resize(); playRep();
  window.__ready = true;
})().catch(error => {
  console.error(error);
  const empty = document.getElementById("empty"); empty.textContent = "운동 동작을 불러오지 못했어요";
  empty.style.setProperty("display","flex","important");
}); else (async () => {
  await loadHumanList();
  const ex = await getJSON("exercises.json"); const SHARED = {"딥스": ["가슴", "삼두"], "풀오버": ["가슴", "등"]}; const SHARED_ID = {"diamond_push_up": ["가슴"], "landmine_press": ["어깨"], "single_arm_landmine_press": ["어깨"]};   // main exercise for two body parts: listed under both
  exercises = ex.exercises.flatMap(e => [e, ...[...(SHARED[e.family] || []), ...(SHARED_ID[e.id] || [])].filter(c => c !== e.cat).map(c => ({...e, cat: c}))]); catOrder = ex.order;
  await poll();
  let ui = null; try { ui = JSON.parse(localStorage.getItem("wg-viewer-ui")); } catch {}
  let last = null; try { last = JSON.parse(localStorage.getItem("wg-viewer-last")); } catch {}
  if (ui) {   // reload keeps the tab, body part, search text and expanded families
    if (ui.tab === "ex" || ui.tab === "mc") tab = ui.tab;
    if (typeof ui.cat === "string") cat = ui.cat;
    if (typeof ui.q === "string") q.value = ui.q;
    (ui.fams || []).forEach(f => openFam.add(f));
    document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  }
  if (last && last.kind === "ex") for (const e of exercises) if (e.id === last.id && e.family) openFam.add(e.cat + "/" + e.family);
  renderCats(); renderList();
  if (last) { await pick(last.kind, last.id, last.label, last.models); const cur = listEl.querySelector("[aria-current]"); if (cur) cur.scrollIntoView({ block: "center" }); }
})();
