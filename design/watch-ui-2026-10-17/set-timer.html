<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>워치짐 · 수동 세트 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0A0A09; --surface:#0E0E0D; --raised:#1C1B19; --hair:#1E1D1A;
 --white:#EDE8DC; --soft:#A39F98; --muted:#8F8B82; --faint:#5C5952;
 --mint:#76DBB9; --on-mint:#04140E; --wash:#0F2A22;
 --rest:#FFDE70; --font:Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--white);font-family:var(--font);padding:48px 24px 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:500;letter-spacing:-.2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 32px;margin-top:44px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.item{display:flex;flex-direction:column;align-items:center}
.cap{margin-top:18px;text-align:left;width:min(100%,340px)}
.cap b{display:block;font-size:14px;font-weight:500}
.watch{width:min(100%,340px);aspect-ratio:1;border-radius:50%;background:#000;position:relative;container-type:size;overflow:hidden;box-shadow:0 0 0 2px #1E1D1A,0 0 0 9px #0E0E0D,0 0 0 10px #34322D}
.face{--u:calc(100cqw/432);position:absolute;inset:0}
svg{width:100%;height:100%;font-family:var(--font)}
text{fill:var(--white);text-anchor:middle}
.clock{font-size:26px;font-weight:500;letter-spacing:.2px}
.name{font-size:34px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:22px;fill:var(--soft)}
.num{font-family:Roboto,sans-serif;font-weight:700;fill:var(--mint)}
.pill{cursor:pointer;outline:none}
.pill > rect{fill:var(--raised)}
.pill text{font-size:24px;font-weight:500}
.pill.primary > rect{fill:var(--mint)}
.pill.primary text{fill:#241A00;font-weight:700}
.pill:focus-visible rect,.pill:focus-visible circle{stroke:var(--white);stroke-width:2}
.pill:active{filter:brightness(.8)}
.step circle{fill:var(--raised)}
.step text{fill:var(--mint);font-size:32px;font-weight:500}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:500 12px var(--font);background:var(--raised);color:var(--white);border:1px solid #34322D;padding:8px 10px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--mint)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.guide{font-size:13px;color:var(--soft);margin-top:12px;min-height:20px}
</style></head>
<body><main class="wrap"><h1>수동 세트 타이머</h1><div class="guide" id="guide" role="status" aria-live="polite">세트 → 완료 → 휴식 · ±10초 · 재생으로 카운트다운</div><div class="grid" id="grid"></div></main>
<script>
// 432-unit coordinates and timing from WatchWorkoutFace / WatchRestControls.
const NS='http://www.w3.org/2000/svg';
const mint='#76DBB9', yellow='#FFDE70';
const cards=[];
const fmt=s=>`${Math.floor(Math.ceil(s)/60)}:${String(Math.ceil(s)%60).padStart(2,'0')}`;
const icon=(type,x=0,y=0)=>`<g transform="translate(${x} ${y})" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">${type==='play'?'<path d="M7 5L19 12L7 19Z"/>':type==='pause'?'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>':'<path d="M6 5L15 12L6 19Z"/><path d="M18.5 5V19"/>'}</g>`;
function action(x,y,w,h,label,kind,fn,textScale=1){
 const g=document.createElementNS(NS,'g');g.setAttribute('class',`pill ${kind==='complete'?'primary':''}`);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',label);
 if(kind==='complete'&&label==='완료'){g.innerHTML=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${20*Math.min(w/138,h/70)}"/><text x="${x+w/2}" y="${y+h/2+12.3*textScale}" style="font-size:${36*textScale}px;fill:#04140E">완료</text>`;g.onclick=fn;g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();fn()}};return g}
 const k=Math.min(w/138,h/70),sz=24*k,gap=8*k,iw=24*k;
 // Measure the same icon + label group as the native canvas pill.
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font=`${kind==='complete'?700:500} ${sz}px Roboto, "Noto Sans KR"`;let tw=ctx.measureText(label).width;
 const fit=Math.min(1,(w-24*k)/(iw+gap+tw)),s=k*fit,left=(w-(32*k+tw)*fit)/2;
 g.innerHTML=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${20*k}"/><g style="color:${kind==='complete'?'#241A00':'#EDE8DC'}" transform="translate(${x+left} ${y+h/2-12*s}) scale(${s})">${icon(kind==='complete'?'play':kind==='pause'?'pause':'skip')}<text x="32" y="20.184" style="font-size:24px;text-anchor:start">${label}</text></g>`;
 const click=()=>{fn()};g.addEventListener('click',click);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click()}});return g;
}
function control(c,y,label,opacity=1,labelOpacity=1){const bar=document.createElementNS(NS,'g');bar.setAttribute('opacity',opacity);bar.innerHTML=`<rect x="48" y="${y}" width="336" height="80" rx="22" fill="#1C1B19"/><text x="87" y="${y+55.7}" style="font-size:46px;fill:#8F8B82">−</text><text x="345" y="${y+55.7}" style="font-size:46px;fill:#8F8B82">+</text><rect x="146" y="${y+6}" width="140" height="68" rx="17" fill="#34322D"/><text x="216" y="${y+52.3}" opacity="${labelOpacity}" style="font-size:36px;font-weight:700;fill:${label==='10초'?'#EDE8DC':mint}">${label}</text>`;
 for(const [x,d] of [[48,-10],[272,10]]){const hit=document.createElementNS(NS,'rect');for(const [k,v] of Object.entries({x,y,width:112,height:80,fill:'transparent',role:'button',tabindex:0,'aria-label':d>0?'10초 추가':'10초 줄이기'}))hit.setAttribute(k,v);hit.style.cursor='pointer';hit.onclick=()=>adjust(c,d);hit.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();adjust(c,d)}};bar.append(hit)}return bar}
function adjust(c,d){if(c.morphing||c.mode==='first'||(c.mode==='rest'&&c.restPaused))return;c.left=Math.max(0,c.left+d);c.total=Math.max(c.total,c.left);draw(c)}
function make(type,title,left,total){const item=document.createElement('section');item.className='item';item.innerHTML=`<div class="watch"><div class="face"><svg viewBox="0 0 432 432" role="group" aria-label="${title}"></svg></div></div><div class="cap"><b>${title}</b><div class="controls"></div></div>`;document.querySelector('#grid').append(item);const c={type,mode:type,left,total,initial:left,initialTotal:total,playing:false,restPaused:false,morphing:false,svg:item.querySelector('svg'),controls:item.querySelector('.controls'),token:0};cards.push(c);
 // Preview playback controls stay outside the watch.
 c.play=document.createElement('button');c.play.textContent='재생';c.play.onclick=()=>{if(c.mode==='first')return;c.playing=!c.playing;c.restPaused=false;sync(c);draw(c)};if(type!=='first')c.controls.append(c.play);
 const reset=document.createElement('button');reset.textContent=type==='first'?'처음 화면':'처음부터 다시 보기';reset.onclick=()=>{resetCard(c);document.querySelector('#guide').textContent='세트 → 완료 → 휴식 · ±10초 · 재생으로 카운트다운'};c.controls.append(reset);
 if(type==='manual'||type==='other'){const replay=document.createElement('button');replay.textContent='모핑 다시 보기';replay.onclick=()=>{resetCard(c);morph(c,false)};c.controls.append(replay)}draw(c);return c}
function sync(c){c.play.textContent=c.playing?'정지':'재생';c.play.setAttribute('aria-pressed',String(c.playing))}
function resetCard(c){c.token++;Object.assign(c,{mode:c.type,left:c.initial,total:c.initialTotal,playing:false,restPaused:false,morphing:false});sync(c);draw(c)}
function draw(c,p=1){const s=c.svg,isRest=c.mode==='rest',first=c.mode==='first',other=c.mode==='other';const color=isRest?yellow:mint;const fraction=Math.min(1,c.left/c.total);
 s.innerHTML=`${!first?`<circle cx="216" cy="216" r="209" fill="none" stroke="#1B1B1A" stroke-width="7"/><circle cx="216" cy="216" r="209" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="${fraction} 1" transform="rotate(-90 216 216)" opacity="${c.restPaused?.35:1}"/>`:''}<path d="M205 27L216 18L227 27 M205 401L216 410L227 401" stroke="#A39F98" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text class="clock" x="216" y="63.9">17:43</text>`;
 if(!isRest||c.morphing){const outgoing=document.createElementNS(NS,'g');outgoing.setAttribute('opacity',c.morphing?Math.max(0,1-4*p):1);outgoing.innerHTML=`<text class="name" x="216" y="100.6" ${other||c.wasOther&&c.morphing?'style="font-size:28px"':''}>${other||c.wasOther&&c.morphing?'원암 케이블 리버스 플라이':'레그 프레스'}</text><text class="sub" x="216" y="134.5">${first?'<tspan fill="#EDE8DC" font-weight="500">1세트 · 40kg</tspan><tspan fill="#8F8B82"> · 직접 기록</tspan>':''}</text>${!first?`<text x="216" y="166.1" style="font-size:50px;font-weight:700">40kg × 12회</text>`:''}`;
 if(!first){outgoing.append(action(other||c.wasOther&&c.morphing?94:96,300,other||c.wasOther&&c.morphing?113:240,other||c.wasOther&&c.morphing?69:78,'완료','complete',()=>morph(c,false),(other||c.wasOther&&c.morphing) ? .81 : 1));if(other||c.wasOther&&c.morphing)outgoing.append(action(225,300,113,69,'건너뛰기','skip',()=>morph(c,true)))}s.append(outgoing)}
 if(first){s.insertAdjacentHTML('beforeend','<text x="169" y="290" class="num" style="font-size:176px;font-weight:500;letter-spacing:-4px">—</text><text x="324" y="278.8" style="font-size:30px;fill:#A39F98">/ 12회</text><path d="M96 322.75H336" stroke="#1E1D1A" stroke-width="1.5"/><text x="205" y="373" style="font-size:37.4px;font-weight:500">—</text><text x="252" y="373" style="font-size:20px;fill:#8F8B82">bpm</text><text class="sub" x="216" y="392" style="fill:#8F8B82">위로 · 횟수 기록</text>');return}
 if(!isRest){s.append(control(c,190,fmt(c.left)));return}
 const t=c.morphing?p:1,scale=(18/54+(1-18/54)*t)*(c.restPaused?.852:1),dy=(230-126)*(1-Math.min(1,t*2))+(c.restPaused?12:0);const blend=(a,b)=>Math.floor(a+(b-a)*t);const timerColor=c.restPaused?'#EDE8DC':`rgb(${blend(118,255)},${blend(219,222)},${blend(185,112)})`;
 s.insertAdjacentHTML('beforeend',`${c.restPaused?'<text class="sub" x="216" y="88.5">휴식 · 일시정지</text>':''}<g transform="translate(216 ${126+dy}) scale(${scale}) translate(-216 -126)"><text class="num" x="216" y="162.8" style="font-size:108px;letter-spacing:-3px;fill:${timerColor}">${fmt(c.left)}</text></g>`);
 s.append(control(c,182+(230-222)*(1-t),'10초',c.restPaused?.35:1,Math.max(0,Math.min(1,(t-.25)/.5))));
 const buttons=document.createElementNS(NS,'g');buttons.setAttribute('opacity',Math.max(0,(t-.45)/.55));const pause=action(67,280,138,70,c.restPaused?'계속':'정지',c.restPaused?'complete':'pause',()=>{if(c.morphing)return;c.restPaused=!c.restPaused;c.playing=!c.restPaused;sync(c);draw(c)});if(c.restPaused)pause.querySelector('rect').style.fill=yellow;buttons.append(pause,action(227,280,138,70,'건너뛰기','skip',()=>{if(c.morphing)return;resetCard(c);document.querySelector('#guide').textContent='휴식 건너뛰기 → 다음 세트 준비'}));s.append(buttons)
}
function morph(c,skip){if(c.morphing||!['manual','other'].includes(c.mode))return;c.wasOther=c.mode==='other';c.mode='rest';c.left=62;c.total=90;c.playing=false;c.restPaused=false;c.morphing=true;sync(c);if(matchMedia('(prefers-reduced-motion: reduce)').matches){c.morphing=false;c.playing=true;sync(c);draw(c);return}const token=++c.token,start=performance.now();document.querySelector('#guide').textContent=skip?'반대손 안 함 → 휴식':'세트 완료 → 휴식';function frame(now){if(token!==c.token)return;const time=Math.min(1,(now-start)/400),p=.5-Math.cos(Math.PI*time)/2;draw(c,p);if(time<1)requestAnimationFrame(frame);else{c.morphing=false;c.playing=true;sync(c);draw(c)}}requestAnimationFrame(frame)}
// Wait for the shared fonts before measuring action labels.
Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,1200))]).then(()=>{make('manual','일반 수동 세트',45,70);make('other','원암 · 반대손',38,55);make('first','첫 세트 · 타이머 없음',0,1);make('rest','휴식',62,90)});
document.fonts.ready.then(()=>cards.forEach(c=>draw(c)));
let previous=performance.now();setInterval(()=>{const now=performance.now(),dt=(now-previous)/1000;previous=now;for(const c of cards){if(!c.playing||c.morphing)continue;c.left=Math.max(0,c.left-dt);if(c.left===0){c.playing=false;sync(c);document.querySelector('#guide').textContent=c.mode==='rest'?'휴식 끝 → 다음 세트 준비':'타이머 끝 · 완료를 눌러 세트 마무리'}draw(c)}},100);
</script></body></html>
